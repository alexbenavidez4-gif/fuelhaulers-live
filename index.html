function ago(t){const d=Math.round((Date.now()-t)/M);if(d<1)return'just now';if(d<60)return d+' min ago';const h=Math.round(d/60);if(h<24)return h+' hr ago';return Math.round(h/24)+' days ago'}

function stars(v){const f=Math.round(v);return'★'.repeat(f)+'☆'.repeat(5-f)}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}
function openSheet(html){$('sheet').innerHTML=html;$('sheetWrap').classList.add('open');document.body.style.overflow='hidden'}
function closeSheet(){$('sheetWrap').classList.remove('open');document.body.style.overflow=''}

function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h}

function busy(b,on,label){if(!b)return;b.disabled=on;if(on){b.dataset.l=b.textContent;b.textContent=label||'Working...'}else if(b.dataset.l)b.textContent=b.dataset.l}

/* ---------- RACKS ---------- */
async function loadReports(){
  const since=new Date(Date.now()-24*60*M).toISOString();
  const {data,error}=await sb.from('reports').select('id,terminal_id,status,trucks,lanes_down,note,created_at,report_confirms(count)')
    .gte('created_at',since).order('created_at',{ascending:false}).limit(1000);
  if(error){console.error(error);return}
  D.reports=data.map(r=>({...r,ok:r.report_confirms?.[0]?.count||0}));D.loaded.reports=true;
  if(S.tab==='racks')render();
}
function latest(tid){return D.reports.find(r=>r.terminal_id===tid)}
function lanesTxt(r){return r.lanes_down?`<b>${r.lanes_down}</b> lane${r.lanes_down>1?'s':''} down`:'No lanes reported down'}
function racks(){
  const q=(S.q||'').toLowerCase();
  const list=TERMINALS.filter(t=>(S.region==='All'||t.region===S.region)&&(!q||(t.name+' '+t.addr+' '+t.id).toLowerCase().includes(q)))
    .sort((a,b)=>((fresh(latest(b.id))?1:0)-(fresh(latest(a.id))?1:0))||a.name.localeCompare(b.name));
  return `<p class="note">${D.loaded.reports?'Tap a terminal to see reports or post one when you get there.':'Loading rack reports...'}</p>
  <input type="text" id="tq" value="${esc(S.q||'')}" placeholder="Search terminals by name, street, or TCN" style="margin-bottom:12px" oninput="S.q=this.value;render()">
  <div class="chips">${['All',...REGIONS].map(r=>`<button class="chip" aria-pressed="${S.region===r}" onclick="S.region='${r}';save();render()">${r}</button>`).join('')}</div>
  ${list.length?'':'<div class="card empty">No terminals match that search.</div>'}
  ${list.map(t=>{const r=latest(t.id),f=fresh(r);return`
  <button class="term" onclick="terminal('${t.id}')">
    <span class="edge" style="background:${f?ST[r.status].c:'var(--chip)'}"></span>
    <span class="body"><h3>${esc(t.name)}</h3>
      <span class="addr">${esc(t.addr)}</span>
      <span class="facts">${f?`<span><b>${r.trucks}</b> in line</span><span>${lanesTxt(r)}</span><span>${ago(T(r.created_at))}</span>`:`<span>No report in the last 2 hours</span>`}</span>
    </span>
    ${f?`<span class="pill" style="background:${ST[r.status].c}">${ST[r.status].n}</span>`:`<span class="pill none">No data</span>`}
  </button>`}).join('')}`;
}
function terminal(id){
  const t=TERMINALS.find(x=>x.id===id),reps=D.reports.filter(r=>r.terminal_id===id).slice(0,8);
  openSheet(head(esc(t.name))+`<p class="addr" style="margin:0 0 14px">${esc(t.addr)}<br>TCN ${esc(t.id)}</p>
  <button class="btn block" onclick="reportForm('${id}')">Report rack status</button>
  <h3 class="section" style="margin-top:18px">Reports from the last 24 hours</h3>
  ${reps.length?reps.map(r=>`<div class="report ${fresh(r)?'':'stale'}">
    <div class="top"><span class="mini" style="background:${ST[r.status].c}">${ST[r.status].n}</span><span class="addr">${ago(T(r.created_at))}</span></div>
    <div class="facts"><span><b>${r.trucks}</b> in line</span><span>${lanesTxt(r)}</span><span>Verified driver</span></div>
    ${r.note?`<p style="margin:6px 0 0">${esc(r.note)}</p>`:''}
    <div class="actions">${fresh(r)?`<button class="ghost" onclick="confirmR(${r.id},'${id}')">Still accurate (${r.ok})</button>`:''}<button class="ghost" onclick="flag('report',${r.id})">Report</button></div>
  </div>`).join(''):'<p class="empty">No reports yet. Be the first when you get there.</p>'}`);
}
async function confirmR(rid,tid){
  if(!canPost())return;
  const {error}=await sb.from('report_confirms').insert({report_id:rid});
  if(error){toast(error.code==='23505'?'You already confirmed this one':'Could not confirm: '+error.message);return}
  const r=D.reports.find(x=>x.id===rid);if(r)r.ok++;terminal(tid);toast('Thanks for confirming');
}
let draft;
function reportForm(id){
  if(!canPost())return;
  const t=TERMINALS.find(x=>x.id===id);draft={tid:id,s:null,trucks:0};
  openSheet(head('Report: '+esc(t.name))+`
  <label>How busy is it?</label>
  <div class="statusPick" id="sp">${ST.map((s,i)=>`<button style="background:${s.c}" aria-pressed="false" onclick="pick(${i})">${s.n}</button>`).join('')}</div>
  <label>Trucks in line</label>
  <div class="stepper"><button onclick="step(-1)" aria-label="Fewer">−</button><output id="tc">0</output><button onclick="step(1)" aria-label="More">+</button></div>
  <label for="dn">Lanes down</label>
  <select id="dn">${Array.from({length:9},(_,i)=>`<option value="${i}">${i}</option>`).join('')}</select>
  <label for="nt">Anything else? (optional)</label>
  <textarea id="nt" maxlength="300" placeholder="Example: lane 2 out of additive"></textarea>
  <label class="check"><input type="checkbox" id="pk"> I'm parked or stopped. I am not driving.</label>
  <button class="btn block" onclick="submitReport(this)">Post report</button>`);
}
function pick(i){draft.s=i;[...$('sp').children].forEach((b,j)=>b.setAttribute('aria-pressed',i===j))}
function step(d){draft.trucks=Math.min(200,Math.max(0,draft.trucks+d));$('tc').textContent=draft.trucks}
async function submitReport(b){
  if(draft.s===null)return toast('Pick how busy it is');
  if(!$('pk').checked)return toast("Only post when you're parked");
  busy(b,true,'Posting...');
  const {error}=await sb.from('reports').insert({terminal_id:draft.tid,status:draft.s,trucks:draft.trucks,lanes_down:+$('dn').value,note:$('nt').value.trim()||null});
  busy(b,false);
  if(error)return toast('Could not post: '+error.message);
  closeSheet();toast('Report posted');loadReports();
}

async function loadPosts(){

    .order('created_at',{ascending:false}).limit(50);
  if(error){console.error(error);return}
  data.forEach(p=>person(p.profiles));
  D.posts=data.map(p=>({...p,likes:p.post_likes?.[0]?.count||0}));
  if(uid()){const {data:l}=await sb.from('post_likes').select('post_id').eq('user_id',uid());D.liked=new Set((l||[]).map(x=>x.post_id))}
  if(S.tab==='feed')render();
}
function feed(){
  if(!D.posts)return '<div class="card empty">Loading...</div>';
  return `<div class="card">
    <label for="pt" style="margin-top:0">Share with the drivers</label>
    <textarea id="pt" maxlength="1000" placeholder="News, a laugh, a heads-up..."></textarea>

    <input type="text" id="pl" maxlength="500" placeholder="Paste a YouTube or TikTok link">

  </div>
  ${D.posts.length?'':'<div class="card empty">No posts yet. Start things off.</div>'}
  ${D.posts.map(p=>{const w=who(p.user_id,p.profiles);return`<div class="card post">
    <div style="display:flex;gap:10px;align-items:center">${av(w.name,w.photo_url,40)}<div><div class="who">${esc(w.name)}</div><div class="when">${ago(T(p.created_at))}</div></div></div>
    ${p.text?`<p>${esc(p.text)}</p>`:''}

    <div class="actions"><button class="ghost" onclick="like(${p.id})">${D.liked.has(p.id)?'👍 Liked':'👍'} ${p.likes}</button>
    ${p.user_id===uid()?`<button class="ghost" onclick="delPost(${p.id})">Delete</button>`:`<button class="ghost" onclick="flag('post',${p.id})">Report</button>`}</div>
  </div>`}).join('')}`;
}
async function addPost(b){
  if(!canPost())return;const text=$('pt').value.trim();let link=$('pl').value.trim();
  if(!text&&!link)return toast('Write something first');
  if(link&&!/^https?:\/\//i.test(link))link='https://'+link;
  busy(b,true,'Posting...');
  const {error}=await sb.from('posts').insert({text:text||null,link:link||null});
  busy(b,false);
  if(error)return toast('Could not post: '+error.message);
  $('pt').value='';$('pl').value='';toast('Posted');loadPosts();
}
async function like(id){
  if(!canPost())return;const p=D.posts.find(x=>x.id===id);
  if(D.liked.has(id)){await sb.from('post_likes').delete().eq('post_id',id).eq('user_id',uid());D.liked.delete(id);p.likes=Math.max(0,p.likes-1)}
  else{const {error}=await sb.from('post_likes').insert({post_id:id});if(error&&error.code!=='23505')return toast(error.message);D.liked.add(id);if(!error)p.likes++}
  render();
}
async function delPost(id){if(!confirm('Delete this post?'))return;const {error}=await sb.from('posts').delete().eq('id',id);if(error)return toast(error.message);loadPosts()}

  <select id="cp" onchange="$('cnWrap').style.display=this.value==='__new'?'block':'none'">

async function resolveCompany(){
  const v=$('cp').value;
  if(v!=='__new')return v?+v:null;
  const n=$('cn').value.trim();if(n.length<2)return null;
  const found=D.companies.find(x=>x.name.toLowerCase()===n.toLowerCase());if(found)return found.id;

  <label for="rt">Your review</label>
  <textarea id="rt" maxlength="1000" placeholder="What should other drivers know?"></textarea>
  <p class="note" style="margin-top:8px">Keep it about the company. Don't name individual people. Your name is not shown.</p>
  <button class="btn block" onclick="submitReview(${c?c.id:0},this)">Post review</button>`);
}
async function submitReview(id,b){
  const text=$('rt').value.trim();
  const row={text};CATS.forEach(([k])=>row[k]=+$('r_'+k).value);
  if(!id&&!$('cp').value)return toast('Choose a company');
  if(!text)return toast('Write a few words first');
  busy(b,true,'Posting...');
  const cid=id||await resolveCompany();
  if(!cid){busy(b,false);return toast('Choose a company')}
  row.company_id=cid;
  const {error}=await sb.from('reviews').insert(row);
  busy(b,false);
  if(error)return toast(error.code==='23505'?'You already reviewed this company':'Could not post: '+error.message);
  await loadJobs();company(cid);toast('Review posted');
}
function jobForm(){
  if(!canPost())return;
  openSheet(head('Post a job')+companyPicker()+`
  <label for="jt">Job title</label><input type="text" id="jt" maxlength="150" placeholder="Example: Local fuel hauler, day shift">
  <label for="jdt">Details</label><textarea id="jdt" maxlength="2000" placeholder="Endorsements needed, schedule, benefits..."></textarea>
  <label for="jpay">Pay (optional)</label><input type="text" id="jpay" maxlength="100" placeholder="Example: $28/hr or per load">
  <label for="jh">Home time</label><select id="jh"><option>Home daily</option><option>Home weekly</option><option>Regional</option><option>OTR</option></select>
  <label for="jcx">How to apply</label><input type="text" id="jcx" maxlength="200" placeholder="Phone, email, or website">
  <button class="btn block" style="margin-top:14px" onclick="submitJob(this)">Post job</button>`);
}
async function submitJob(b){
  const title=$('jt').value.trim();
  if(!$('cp').value)return toast('Choose a company');
  if(title.length<2)return toast('Add a job title');
  busy(b,true,'Posting...');
  const cid=await resolveCompany();
  if(!cid){busy(b,false);return toast('Choose a company')}
  const {error}=await sb.from('jobs').insert({company_id:cid,title,details:$('jdt').value.trim()||null,pay:$('jpay').value.trim()||null,home:$('jh').value,contact:$('jcx').value.trim()||null});
  busy(b,false);
  if(error)return toast('Could not post: '+error.message);
  closeSheet();toast('Job posted');loadJobs();
}

/* ---------- MEMORIAL ---------- */
async function loadTributes(){
  const {data,error}=await sb.from('tributes').select('id,name,company,years,message,approved,created_at,tribute_candles(count)').order('created_at',{ascending:false});
  if(error){console.error(error);return}
  D.tributes=data.map(t=>({...t,candles:t.tribute_candles?.[0]?.count||0}));
  if(S.tab==='memorial')render();
}
function memorial(){
  if(!D.tributes)return '<div class="card empty">Loading...</div>';
  return `<h2 class="section">Gone but not forgotten</h2>
  <p class="note">Honoring the fuel haulers we've lost. Tributes are reviewed by an admin before they appear.</p>
  ${D.tributes.length?D.tributes.map(t=>`<div class="card tribute"><h3>${esc(t.name)}${t.approved?'':'<span class="tag">waiting for review</span>'}</h3>
    <div class="addr">${esc([t.company,t.years].filter(Boolean).join(', '))}</div>
    ${t.message?`<p>${esc(t.message)}</p>`:''}
    ${t.approved?`<div class="actions"><button class="ghost" onclick="candle(${t.id})">🕯 Light a candle (${t.candles})</button></div>`:''}</div>`).join('')
  :'<div class="card empty">No tributes yet.</div>'}
  <div class="card"><h3 class="section">Add a tribute</h3>
    <label for="tn">Driver's name</label><input type="text" id="tn" maxlength="100">
    <label for="tco">Company they drove for</label><input type="text" id="tco" maxlength="100">
    <label for="ty">Years driving (optional)</label><input type="text" id="ty" maxlength="50" placeholder="Example: 1998 to 2025">
    <label for="tm">A few words</label><textarea id="tm" maxlength="2000"></textarea>
    <div style="margin-top:12px"><button class="btn" onclick="addTribute(this)">Send for review</button></div>
  </div>`;
}
async function addTribute(b){
  if(!canPost())return;const name=$('tn').value.trim();if(name.length<2)return toast("Add the driver's name");
  busy(b,true,'Sending...');
  const {error}=await sb.from('tributes').insert({name,company:$('tco').value.trim()||null,years:$('ty').value.trim()||null,message:$('tm').value.trim()||null});
  busy(b,false);
  if(error)return toast('Could not send: '+error.message);
  ['tn','tco','ty','tm'].forEach(i=>$(i).value='');toast('Sent. It will appear once an admin approves it.');loadTributes();
}
async function candle(id){
  if(!D.session){toast('Sign in first');go('me');return}
  const {error}=await sb.from('tribute_candles').insert({tribute_id:id});
  if(error)return toast(error.code==='23505'?'You already lit a candle':error.message);
  const t=D.tributes.find(x=>x.id===id);if(t)t.candles++;render();
}

/* ---------- ME: sign in, join, profile ---------- */
function me(){
  if(D.recovery)return `<div class="card"><h2 class="section">Set a new password</h2>
    <label for="np">New password</label><input type="password" id="np" autocomplete="new-password">
    <button class="btn block" style="margin-top:14px" onclick="setPw(this)">Save password</button></div>`;
  if(D.session){
    if(!D.me)return '<div class="card empty">Loading your profile...</div>';
    const m=D.me;
    return `<div class="card"><div class="profTop">${av(m.name,m.photo_url,96)}
      <div><label class="btn alt photoBtn">${m.photo_url?'Change photo':'Add a photo'}<input type="file" accept="image/*" onchange="pickPhoto(event)" hidden></label>
      ${m.photo_url?'<button class="ghost" style="margin-left:6px" onclick="removePhoto()">Remove</button>':''}
      <p class="note" style="margin:8px 0 0">Your truck, your dog, your family. Anything you like.</p></div></div>
      <h2 class="section">${esc(m.name)}</h2>
      <div class="addr">${esc(m.company)}, ${esc(m.region)}</div>
      <p>Endorsements: ${m.endorsements&&m.endorsements.length?m.endorsements.map(esc).join(', '):'none listed'}</p>
      ${m.approved?'<span class="hiring" style="margin-top:0">Verified driver</span>':'<div class="card" style="background:var(--bg);margin:10px 0 0"><b>Waiting for approval.</b> An admin checks every new driver before they can post. You can still look around.</div>'}
    </div>
    <button class="btn alt" onclick="signOut()">Sign out</button>`;
  }
  if(D.checkEmail)return `<div class="card"><h2 class="section">Check your email</h2>
    <p>We sent a link to <b>${esc(D.checkEmail)}</b>. Tap it to confirm your account, then come back here and sign in.</p>
    <button class="btn alt" onclick="D.checkEmail=null;S.auth='in';render()">Go to sign in</button></div>`;
  if(S.auth==='in')return `<div class="card"><h2 class="section">Sign in</h2>
    <label for="le">Email</label><input type="email" id="le" autocomplete="email">
    <label for="lp">Password</label><input type="password" id="lp" autocomplete="current-password" onkeydown="if(event.key==='Enter')signIn()">
    <button class="btn block" style="margin-top:14px" onclick="signIn(this)">Sign in</button>
    <div class="actions" style="margin-top:12px"><button class="ghost" onclick="forgot()">Forgot password?</button><button class="ghost" onclick="S.auth='up';render()">New here? Join</button></div></div>`;
  return `<div class="card"><h2 class="section">Join fuelhaulers.live</h2>
    <p class="note">Drivers only. After you join, an admin approves your account before you can post.</p>
    <label for="jn">Your name</label><input type="text" id="jn" maxlength="100" autocomplete="name">
    <label for="jc">Company you drive for</label><input type="text" id="jc" maxlength="100">
    <label for="jr">Home area</label><select id="jr">${REGIONS.map(r=>`<option>${r}</option>`).join('')}</select>
    <label>Endorsements</label>
    <label class="check"><input type="checkbox" value="Tanker (N)" class="je"> Tanker (N)</label>
    <label class="check"><input type="checkbox" value="HazMat (H)" class="je"> HazMat (H)</label>
    <label class="check"><input type="checkbox" value="Tanker + HazMat (X)" class="je"> Tanker + HazMat (X)</label>
    <label for="jem">Email</label><input type="email" id="jem" autocomplete="email">
    <label for="jpw">Password (at least 8 characters)</label><input type="password" id="jpw" autocomplete="new-password">
    <label class="check"><input type="checkbox" id="jd"> I hold a CDL and haul fuel for a living.</label>
    <button class="btn block" onclick="signUp(this)">Join</button>
    <div class="actions" style="margin-top:12px"><button class="ghost" onclick="S.auth='in';render()">Already joined? Sign in</button></div></div>`;
}
async function signUp(b){
  const name=$('jn').value.trim(),company=$('jc').value.trim(),email=$('jem').value.trim(),password=$('jpw').value;
  if(!name||!company)return toast('Add your name and company');
  if(!email)return toast('Add your email');
  if(password.length<8)return toast('Password needs at least 8 characters');
  if(!$('jd').checked)return toast('This app is for fuel haulers only');
  const region=$('jr').value,endorsements=[...document.querySelectorAll('.je:checked')].map(x=>x.value);
  busy(b,true,'Joining...');
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{name,company,region,endorsements},emailRedirectTo:location.origin}});
  busy(b,false);
  if(error)return toast(error.message);
  if(data.user&&data.user.identities&&data.user.identities.length===0){S.auth='in';render();return toast('That email already has an account. Sign in instead.')}
  S.region=region;S.city=region;save();
  if(!data.session){D.checkEmail=email;render()}
}
async function signIn(b){
  const email=$('le').value.trim(),password=$('lp').value;
  if(!email||!password)return toast('Enter your email and password');
  busy(b,true,'Signing in...');
  const {error}=await sb.auth.signInWithPassword({email,password});
  busy(b,false);
  if(error)return toast(/confirm/i.test(error.message)?'Confirm your email first. Check your inbox.':error.message);
  toast('Signed in');
}
async function forgot(){
  const email=($('le')&&$('le').value.trim())||prompt('Your email address');if(!email)return;
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
  toast(error?error.message:'Check your email for a reset link');
}
async function setPw(b){
  const p=$('np').value;if(p.length<8)return toast('Use at least 8 characters');
  busy(b,true);const {error}=await sb.auth.updateUser({password:p});busy(b,false);
  if(error)return toast(error.message);D.recovery=false;render();toast('Password updated');
}
async function signOut(){await sb.auth.signOut();D.me=null;D.liked=new Set();render()}
function pickPhoto(e){
  const f=e.target.files[0];if(!f)return;
  if(!f.type.startsWith('image/'))return toast('Pick a photo file');
  const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{
    const s=256,c=document.createElement('canvas');c.width=c.height=s;
    const m=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
    c.toBlob(uploadPhoto,'image/jpeg',.82);
  };img.onerror=()=>toast('That photo could not be opened');img.src=rd.result};
  rd.readAsDataURL(f);
}
async function uploadPhoto(blob){
  if(!blob)return toast('That photo could not be opened');
  toast('Uploading...');
  const path=uid()+'/avatar.jpg';
  const {error}=await sb.storage.from('avatars').upload(path,blob,{upsert:true,contentType:'image/jpeg'});
  if(error)return toast('Upload failed: '+error.message);
  const url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?v='+Date.now();
  const r=await sb.from('profiles').update({photo_url:url}).eq('id',uid());
  if(r.error)return toast(r.error.message);
  D.me.photo_url=url;person(D.me);render();toast('Photo updated');
}
async function removePhoto(){
  await sb.storage.from('avatars').remove([uid()+'/avatar.jpg']);
  await sb.from('profiles').update({photo_url:null}).eq('id',uid());
  D.me.photo_url=null;person(D.me);render();
}

/* ---------- DRAWING THE SCREEN ---------- */
function render(){
  const a=document.activeElement,fid=a&&a.id,pos=a&&a.selectionStart,keep={};
  document.querySelectorAll('#app input[id],#app textarea[id]').forEach(e=>{if(e.type!=='file'&&e.type!=='checkbox')keep[e.id]=e.value});
  renderTabs();
  $('app').innerHTML=({racks,chat,feed,jobs,memorial,me}[S.tab]||racks)();
  for(const k in keep){const e=$(k);if(e&&e.type!=='file'&&e.type!=='checkbox')e.value=keep[k]}
  if(fid&&$(fid)&&$('app').contains($(fid))){const e=$(fid);e.focus();try{if(pos!=null)e.setSelectionRange(pos,pos)}catch(err){}}
  const m=$('msgs');if(m)m.scrollTop=m.scrollHeight;
}

async function loadMe(){
  if(!uid()){D.me=null;return}
  const {data,error}=await sb.from('profiles').select('*').eq('id',uid()).maybeSingle();
  if(error)console.error(error);
  D.me=data||null;person(D.me);
}
sb.auth.onAuthStateChange((ev,session)=>{
  D.session=session;
  if(ev==='PASSWORD_RECOVERY'){D.recovery=true;S.tab='me'}
  setTimeout(async()=>{await loadMe();if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')loadPosts();render()},0);
});

sb.channel('live')
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'reports'},({new:r})=>{
    if(D.reports.some(x=>x.id===r.id))return;D.reports.unshift({...r,ok:0});if(S.tab==='racks')render();
  })
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},async({new:m})=>{
    const list=D.chats[m.region];if(!list||list.some(x=>x.id===m.id))return;
    if(!D.people[m.user_id]){const {data}=await sb.from('profiles').select('id,name,photo_url').eq('id',m.user_id).maybeSingle();person(data)}
    list.push(m);if(S.tab==='chat'&&S.city===m.region)render();
  })
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'posts'},()=>loadPosts())
  .subscribe();

render();
(async()=>{
  const {data}=await sb.auth.getSession();D.session=data.session;await loadMe();render();
  loadReports();loadPosts();loadJobs();loadTributes();
})();
setInterval(()=>{if(S.tab==='racks')render()},60000);
setInterval(loadReports,5*60000);
</script>
</body>
</html>
