<style>
:root{
  color-scheme:dark;
  --bg:#08090a;--surface:#141619;--surface2:#101215;--ink:#F1F1F1;--muted:#9EA4AC;--line:#2A2E35;
  --orange:#FF8A00;--orange2:#FFB347;--orangeDeep:#E35F00;--chip:#20242A;
  --s0:#2FA35A;--s1:#D6AE22;--s2:#FF7A00;--s3:#E0262F;--red:#FF8A00;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg) radial-gradient(1200px 500px at 50% 0,rgba(255,120,0,.10),transparent 70%) no-repeat;color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
a{color:var(--orange2)}

/* ---------- BANNER ---------- */
.hero{position:relative;max-width:1600px;margin:0 auto;container-type:inline-size;background:#0a0a0b}
.hero img{display:block;width:100%;height:auto}
.hero h1{position:absolute;inset:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tag{position:absolute;left:0;right:0;top:80.5%;text-align:center;pointer-events:none;
  font-family:"Permanent Marker","Barlow Condensed",cursive;font-size:max(2.9vw,13px);font-size:max(2.9cqw,13px);
  line-height:1;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.tag span{display:inline-block;transform:skewX(-8deg);text-shadow:0 2px 0 #000,0 0 14px rgba(0,0,0,.9)}
.tag .o{color:var(--orange);text-shadow:0 2px 0 #000,0 0 16px rgba(255,120,0,.55)}
.tag .w{color:#F4F4F4}
.tag::after{content:"";display:block;margin:.28em auto 0;width:min(56%,720px);height:.2em;border-radius:50%;
  background:linear-gradient(90deg,transparent,var(--orangeDeep) 12%,var(--orange2) 50%,var(--orangeDeep) 88%,transparent);
  box-shadow:0 0 12px rgba(255,120,0,.6);transform:skewX(-20deg)}

/* ---------- BUTTON BAR ---------- */
.navwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;
  background:linear-gradient(#0d0e10,#060607);border-top:2px solid var(--orange);border-bottom:1px solid #3a2410;
  box-shadow:0 -6px 18px rgba(255,120,0,.35),0 6px 18px rgba(0,0,0,.7)}
.nav{display:flex;gap:10px;max-width:1600px;margin:0 auto;padding:10px 14px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.navbtn{flex:1 1 auto;min-width:0;border:0;padding:2px;background:linear-gradient(135deg,var(--orange2),var(--orangeDeep) 45%,#5a2a00 70%,var(--orange));
  clip-path:polygon(16px 0,100% 0,calc(100% - 16px) 100%,0 100%);color:#fff;
  transition:filter .15s ease,transform .15s ease}
.navbtn .in{display:flex;align-items:center;justify-content:center;gap:12px;height:100%;padding:10px 22px;
  background:linear-gradient(#17191c,#0b0c0e);clip-path:polygon(15px 0,100% 0,calc(100% - 15px) 100%,0 100%)}
.navbtn svg{width:30px;height:30px;flex:none;filter:drop-shadow(0 0 6px rgba(255,120,0,.45))}
.navbtn .lb{position:relative;font:800 italic 20px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;text-shadow:0 1px 0 #000}
.navbtn .lb::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:3px;border-radius:50%;
  background:linear-gradient(90deg,transparent,var(--orange) 20%,var(--orange2) 60%,transparent)}
.navbtn .short{display:none}
.navbtn:hover{filter:brightness(1.15)}
.navbtn[aria-current="true"]{filter:drop-shadow(0 0 10px rgba(255,130,0,.75))}
.navbtn[aria-current="true"] .in{background:radial-gradient(120% 140% at 50% 110%,rgba(255,120,0,.55),transparent 60%),linear-gradient(#2a1a0c,#120b05)}
@media (max-width:1250px){
  .navbtn .in{padding:9px 14px;gap:8px}
  .navbtn svg{width:24px;height:24px}
  .navbtn .lb{font-size:17px}
}
@media (max-width:1050px){
  .nav{gap:6px;padding:8px}
  .navbtn{flex:1 1 0;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
  .navbtn .in{flex-direction:column;gap:5px;padding:8px 8px;clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%)}
  .navbtn .lb{font-size:15px}
  .navbtn .lb::after{bottom:-4px;height:2px}
  .navbtn .full{display:none}.navbtn .short{display:inline}
}
@media (max-width:700px){
  .nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}
  .navbtn .in{flex-direction:row;gap:7px;padding:9px 6px}
  .navbtn svg{width:20px;height:20px}
  .navbtn .lb{font-size:15px}
}

/* ---------- PAGE ---------- */
main{max-width:900px;margin:0 auto;padding:18px 16px 60px}
.note{font-size:14px;color:var(--muted);margin:0 0 14px}
.section{font-size:26px;margin:4px 0 8px;color:#fff}
.section::after{content:"";display:block;width:64px;height:3px;margin-top:4px;border-radius:2px;background:linear-gradient(90deg,var(--orange),transparent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:7px 14px;font:700 italic 16px "Barlow Condensed",sans-serif;text-transform:uppercase;transform:skewX(-8deg)}
.chip[aria-pressed="true"]{background:linear-gradient(var(--orange2),var(--orangeDeep));color:#140800;border-color:var(--orange);box-shadow:0 0 12px rgba(255,120,0,.45)}
.card,.term{background:linear-gradient(var(--surface),var(--surface2));border:1px solid var(--line);border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,140,0,.18),0 4px 14px rgba(0,0,0,.35)}
.card{padding:14px;margin-bottom:10px}
.term{display:flex;width:100%;text-align:left;margin-bottom:10px;padding:0;overflow:hidden;color:var(--ink)}
.term:hover{border-color:#5a3a1a}
.term .edge{width:8px;flex:none}
.term .body{flex:1;padding:12px 14px;min-width:0}
.term h3{font-size:22px;line-height:1.1}
.addr{font-size:14px;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;margin-top:6px}
.facts b{font-weight:600;color:#fff}
.pill{align-self:center;margin-right:14px;padding:6px 12px;border-radius:4px;color:#fff;font:800 italic 18px "Barlow Condensed",sans-serif;text-transform:uppercase;min-width:92px;text-align:center;box-shadow:0 0 12px rgba(0,0,0,.4)}
.pill.none{background:var(--chip);color:var(--muted);font-size:15px}
.tag2,.tag-s{display:inline-block;font-size:12px;padding:1px 6px;border-radius:3px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:middle;font:500 12px Barlow,sans-serif;text-transform:none}
.btn{border:0;border-radius:4px;padding:12px 20px;font:800 italic 18px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.02em;
  background:linear-gradient(var(--orange2),var(--orange) 45%,var(--orangeDeep));color:#170a00;box-shadow:0 0 14px rgba(255,120,0,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:linear-gradient(#1d2025,#121418);color:#fff;border:1px solid var(--orange);box-shadow:0 0 10px rgba(255,120,0,.2)}
.btn.block{width:100%}
.btn:disabled{opacity:.6;cursor:wait}
label{display:block;font-weight:600;font-size:15px;margin:12px 0 6px}
input[type=text],input[type=email],input[type=password],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:#0c0d10;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 2px rgba(255,120,0,.25)}
textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:500;margin:12px 0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--orange)}
.statusPick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.statusPick button{border:2px solid transparent;border-radius:4px;padding:14px 4px;color:#fff;font:800 italic 19px "Barlow Condensed",sans-serif;text-transform:uppercase;opacity:.5}
.statusPick button[aria-pressed="true"]{opacity:1;border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.3)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:4px;border:1px solid var(--line);background:#0c0d10;font-size:22px}
.stepper output{font:800 italic 28px "Barlow Condensed",sans-serif;min-width:40px;text-align:center}
.sheetWrap{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center}
.sheetWrap.open{display:flex}
.sheet{background:linear-gradient(#17191c,#0f1013);border-top:2px solid var(--orange);box-shadow:0 -8px 30px rgba(255,120,0,.25);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:10px 10px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheetHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
.sheetHead h2{font-size:28px;line-height:1.05}
.x{background:var(--chip);border:0;border-radius:4px;width:38px;height:38px;font-size:20px;flex:none}
.report{border-top:1px solid var(--line);padding:12px 0}
.report .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{font:800 italic 15px "Barlow Condensed",sans-serif;text-transform:uppercase;color:#fff;padding:2px 8px;border-radius:3px}
.stale{opacity:.55}
.post .who{font-weight:600}
.post .when{font-size:13px;color:var(--muted)}
.post p{margin:6px 0}
.linkbox{display:block;border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:14px;word-break:break-all;color:var(--orange2);background:#0c0d10;text-decoration:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ghost{background:none;border:1px solid var(--line);border-radius:4px;padding:6px 12px;font-size:14px;color:var(--ink)}
.ghost:hover{border-color:var(--orange)}
.ghost.sm{padding:1px 6px;font-size:12px;margin-left:4px;opacity:.7}
.stars{color:var(--orange2);letter-spacing:1px}
.scores{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;font-size:14px;align-items:center;margin-top:8px}
.meter{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--orangeDeep),var(--orange2))}
.hiring{display:inline-block;background:var(--s0);color:#fff;font-size:13px;font-weight:600;padding:2px 8px;border-radius:3px;margin-top:6px}
.rate{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 10px}
.rate select{width:auto}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.tribute h3{font-size:24px}
.av{border-radius:50%;flex:none;display:inline-grid;place-items:center;object-fit:cover;color:#fff;font:700 14px "Barlow Condensed",sans-serif;border:1px solid rgba(255,140,0,.5)}
.chatBox{display:flex;flex-direction:column;height:60vh;min-height:320px;padding:0}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;gap:8px;align-items:flex-end;max-width:90%;align-self:flex-start}
.mrow.mine{align-self:flex-end;flex-direction:row-reverse}
.msg{min-width:0;background:#1d2025;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.msg.mine{background:linear-gradient(var(--orange2),var(--orangeDeep));color:#170a00;border-color:var(--orange)}
.msg .who{font-size:13px;font-weight:600}
.msg .when{font-weight:400;color:var(--muted)}
.msg.mine .when{color:inherit;opacity:.7}
.compose{display:flex;gap:8px;border-top:1px solid var(--line);padding:10px}
.compose input{flex:1;min-width:0}
.profTop{display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.photoBtn{display:inline-block;margin:0;padding:9px 14px;font-size:16px;cursor:pointer}
.myspot{border-color:var(--orange);box-shadow:0 0 16px rgba(255,120,0,.3),inset 0 1px 0 rgba(255,140,0,.3)}
.site-foot{border-top:1px solid var(--line);color:var(--muted);font-size:14px;text-align:center;padding:20px 16px 30px}
.dangerzone{margin-top:22px;border-color:#5a1f1f}
.ghost.danger{border-color:var(--s3);color:#ff9b9b}
.scaleTop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.scaleTop .pill{margin-right:0}
.hw{display:inline-block;font:700 italic 15px "Barlow Condensed",sans-serif;background:var(--chip);color:var(--orange2);border:1px solid #3a2a18;border-radius:3px;padding:1px 7px;vertical-align:middle;margin-left:4px}
.scalebtn{flex:1;padding:10px 12px;font-size:16px}
.scalebtn.open{background:linear-gradient(#ff5a5f,#c81e2a);color:#fff}
.scalebtn.closed{background:linear-gradient(#3fbf6e,#237a45);color:#fff}
.roletag{display:inline-block;font:700 11px Barlow,sans-serif;text-transform:uppercase;letter-spacing:.04em;background:#2b3a55;color:#cfe0ff;border-radius:3px;padding:1px 6px;vertical-align:middle}
.msg.mine .roletag{background:rgba(0,0,0,.25);color:inherit}
.rolesel{width:auto;padding:6px 8px;font-size:14px}
.msgacts{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.msg.mine .msgacts{justify-content:flex-end}
.react{font-size:13px}
.react.on{border-color:var(--orange);color:var(--orange2);background:rgba(255,138,0,.12)}
.react.own{font-size:12px;opacity:.8}
.hiddennote{font-size:12px;opacity:.75}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.regionSel{width:auto;min-width:240px;max-width:100%;margin-bottom:14px;padding:10px 12px;font:700 italic 18px "Barlow Condensed",sans-serif;text-transform:uppercase;border:1px solid var(--orange);box-shadow:0 0 10px rgba(255,120,0,.2)}
.tgal{display:grid;gap:8px;margin:10px 0}
.tgal.n2{grid-template-columns:1fr 1fr}
.tgal img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.tgal.n1 img{aspect-ratio:auto;max-height:440px}
.tphotos{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tp{position:relative}
.tp img{display:block;width:96px;height:96px;object-fit:cover;border-radius:4px;border:1px solid var(--orange)}
.tp .x{position:absolute;top:4px;right:4px;width:26px;height:26px;font-size:13px;background:rgba(0,0,0,.75);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#16181b;color:#fff;border:1px solid var(--orange);box-shadow:0 0 16px rgba(255,120,0,.4);padding:10px 18px;border-radius:4px;z-index:20;font-weight:600;display:none;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>

</defs></svg>

function uid(){return D.session?.user?.id}
function canPost(){
  if(!D.session){closeSheet();toast('Sign in first');go('me');return false}
  if(!D.me||!D.me.approved){toast('Posting is turned off for your account. Email support@fuelhaulers.live');return false}
  return true;
}
function canDrive(){
  if(!canPost())return false;
  if(D.me.role&&D.me.role!=='driver'){toast('Rack reports, scale reports, and company reviews are for drivers only');return false}
  return true;
}
const FLAG_REASONS=['Spam or advertising','Harassment or threats','Fake or false information','Personal info about someone','Sexual or offensive content','Other'];
function flag(kind,id){
  if(!D.session){closeSheet();toast('Sign in to report something');go('me');return}
  openSheet(head('Report this')+`<p class="note">Reports are for things that break the rules. If 3 members report the same thing, it's hidden until an admin reviews it. To show you like something, use 👍 instead.</p>
  ${FLAG_REASONS.map((r,i)=>`<label class="check"><input type="radio" name="fr" value="${i}"> ${r}</label>`).join('')}
  <label for="fd">Details (optional)</label><textarea id="fd" maxlength="300"></textarea>
  <button class="btn block" style="margin-top:12px" onclick="sendFlag('${kind}','${id}',this)">Send report</button>`);
}
async function sendFlag(kind,id,b){
  const sel=document.querySelector('input[name=fr]:checked');if(!sel)return toast('Pick a reason');
  const d=$('fd').value.trim();
  busy(b,true,'Sending...');
  const {error}=await sb.from('content_flags').insert({kind,item_id:String(id),reason:(FLAG_REASONS[+sel.value]+(d?': '+d:'')).slice(0,500)});
  busy(b,false);
  if(error)return toast(error.code==='23505'?'You already reported this':/own post/.test(error.message)?"You can't report your own post":'Could not send: '+error.message);
  closeSheet();toast('Thanks. Your report was sent.');track('content_report',{kind});
}
/* thumbs up and helpful votes */
async function loadReacts(kind,ids){
  if(!ids.length)return;
  const {data,error}=await sb.from('reactions').select('item_id,user_id').eq('kind',kind).in('item_id',ids);
  if(error)return;
  ids.forEach(id=>D.react[kind+':'+id]={n:0,mine:false});
  data.forEach(r=>{const o=D.react[kind+':'+r.item_id];if(!o)return;o.n++;if(r.user_id===uid())o.mine=true});
}
function rx(kind,id){return D.react[kind+':'+id]||{n:0,mine:false}}
async function toggleReact(kind,id,cid){
  if(!canPost())return;
  const o=rx(kind,id);D.react[kind+':'+id]=o;
  if(o.mine){
    const {error}=await sb.from('reactions').delete().eq('kind',kind).eq('item_id',id).eq('user_id',uid());
    if(error)return toast(error.message);o.mine=false;o.n=Math.max(0,o.n-1);
  }else{
    const {error}=await sb.from('reactions').insert({kind,item_id:id});
    if(error&&error.code!=='23505')return toast(error.message);o.mine=true;o.n++;
  }
  render();if(cid)company(cid);
}
function thumb(kind,id,own){const o=rx(kind,id);
  if(own)return o.n?`<span class="react own">👍 ${o.n}</span>`:'';
  return `<button class="ghost sm react ${o.mine?'on':''}" onclick="toggleReact('${kind}',${id})" aria-label="Thumbs up">👍${o.n?' '+o.n:''}</button>`}

function flagGroups(){const g={};(D.admin.flags||[]).forEach(f=>{const k=f.kind+':'+f.item_id;(g[k]=g[k]||{kind:f.kind,item_id:f.item_id,list:[]}).list.push(f)});return Object.values(g)}
function adminCount(){const A=D.admin;if(!A.pending)return 0;return A.pending.length+A.tributes.length+flagGroups().length+(A.scales||[]).length}
function regionPicker(key,withAll){
  const cur=S[key],list=withAll?['All',...REGIONS]:REGIONS;
  if(!list.includes(cur))S[key]=withAll?'All':REGIONS[0];
  return `<label class="sr" for="rp_${key}">City</label><select id="rp_${key}" class="regionSel" onchange="S.${key}=this.value;save();render()">${list.map(r=>`<option value="${r}" ${r===S[key]?'selected':''}>${r==='All'?'All of Texas':r}</option>`).join('')}</select>`;
}
async function loadBlocks(){
  if(!uid()){D.blocked=new Set();return}
  const {data,error}=await sb.from('blocks').select('blocked_id').eq('user_id',uid());
  if(error){D.blocked=new Set();return}
  D.blocked=new Set(data.map(x=>x.blocked_id));
  const need=[...D.blocked].filter(id=>!D.people[id]);
  if(need.length){const r=await sb.from('profiles').select('*').in('id',need);(r.data||[]).forEach(person)}
}
async function blockUser(id){
  if(!D.session){toast('Sign in first');return}
  const p=D.people[id]||{name:'this driver'};
  if(!confirm(`Block ${p.name}? You won't see their chat messages or posts. You can undo this on your Me page.`))return;
  const {error}=await sb.from('blocks').insert({blocked_id:id});
  if(error&&error.code!=='23505')return toast('Could not block: '+error.message);
  D.blocked.add(id);render();toast('Blocked');
}
async function unblock(id){
  const {error}=await sb.from('blocks').delete().eq('user_id',uid()).eq('blocked_id',id);
  if(error)return toast(error.message);D.blocked.delete(id);render();toast('Unblocked');
}
function renderTabs(){
  const n=adminCount(),tabs=D.me&&D.me.is_admin?[...TABS,['admin',n?`Admin (${n})`:'Admin',n?`Admin (${n})`:'Admin']]:TABS;
  $('tabs').innerHTML=tabs.map(([k,l,s])=>`<button class="navbtn" aria-current="${S.tab===k}" onclick="go('${k}')"><span class="in"><svg viewBox="0 0 24 24" fill="url(#og)" aria-hidden="true">${ICONS[k]}</svg><span class="lb"><span class="full">${l}</span><span class="short">${s}</span></span></span></button>`).join('');
}
function track(name,params){try{if(window.gtag)gtag('event',name,params||{})}catch(e){}}
function go(k){closeSheet();S.tab=k;save();render();window.scrollTo(0,0);
  const t=TABS.find(x=>x[0]===k);track('page_view',{page_title:(t?t[1]:k)+' | fuelhaulers.live',page_location:location.origin+'/'+k});}

/* ---------- RACKS ---------- */
const UPD_HOURS=6;
const RFULL='id,terminal_id,status,trucks,lanes_down,note,created_at,user_id,ahead,behind,updated_at,updates,report_confirms(count)';
const RFULL2='*,report_confirms(count),report_disputes(count)';
const RBASIC='id,terminal_id,status,trucks,lanes_down,note,created_at,user_id,report_confirms(count)';
function rt(r){return T(r.updated_at||r.created_at)}
function sortReports(){D.reports.sort((a,b)=>rt(b)-rt(a))}
async function loadReports(){
  const since=new Date(Date.now()-24*60*M).toISOString();
  let q=await sb.from('reports').select(RFULL2).gte('updated_at',since).order('updated_at',{ascending:false}).limit(1000);
  if(q.error)q=await sb.from('reports').select(RFULL).gte('updated_at',since).order('updated_at',{ascending:false}).limit(1000);
  if(q.error){D.noUpdates=true;q=await sb.from('reports').select(RBASIC).gte('created_at',since).order('created_at',{ascending:false}).limit(1000)}
  else D.noUpdates=false;
  if(q.error){console.error(q.error);return}
  D.reports=q.data.map(r=>({...r,ok:r.report_confirms?.[0]?.count||0,bad:r.report_disputes?.[0]?.count||0}));sortReports();D.loaded.reports=true;
  if(S.tab==='racks')render();
}
function latest(tid){return D.reports.find(r=>r.terminal_id===tid&&!r.disputed&&!r.hidden)}
function fresh(r){return r&&Date.now()-rt(r)<FRESH}
function canUpdate(r){return !D.noUpdates&&r&&r.user_id&&r.user_id===uid()&&Date.now()-T(r.created_at)<UPD_HOURS*60*M}
function myActive(){return D.reports.find(r=>canUpdate(r)&&fresh(r))}
function lanesTxt(r){return r.lanes_down?`<b>${r.lanes_down}</b> lane${r.lanes_down>1?'s':''} down`:'No lanes reported down'}
function lineTxt(r){const who=r.user_id&&r.user_id===uid()?'you':'reporter';
  if(r.ahead==null)return `<span><b>${r.trucks}</b> in line</span>`;
  return `<span><b>${r.trucks}</b> in line</span><span><b>${r.ahead}</b> ahead of ${who}</span><span><b>${r.behind||0}</b> behind</span>`;
}
function whenTxt(r){return r.updates?`updated ${ago(rt(r))}`:ago(rt(r))}
function tname(id){const t=TERMINALS.find(x=>x.id===id);return t?t.name:id}
function racks(){
  const q=(S.q||'').toLowerCase(),mine=myActive();
  const list=TERMINALS.filter(t=>(S.region==='All'||t.region===S.region)&&(!q||(t.name+' '+t.addr+' '+t.id).toLowerCase().includes(q)))
    .sort((a,b)=>((fresh(latest(b.id))?1:0)-(fresh(latest(a.id))?1:0))||a.name.localeCompare(b.name));
  return `${mine?`<div class="card myspot">
      <div class="addr" style="color:var(--orange2);font-weight:600">YOUR SPOT</div>
      <h3 style="font-size:22px">${esc(tname(mine.terminal_id))}</h3>
      <div class="facts">${lineTxt(mine)}<span>${whenTxt(mine)}</span></div>
      <div class="actions"><button class="btn" onclick="reportForm('${mine.terminal_id}',${mine.id})">Update my spot</button>${mine.ahead?`<button class="btn alt" onclick="loadingNow(${mine.id},this)">I'm loading now</button>`:''}</div>
    </div>`:''}
  <p class="note">${D.loaded.reports?'Tap a terminal to see reports or post one when you get there.':'Loading rack reports...'}</p>
  <input type="text" id="tq" value="${esc(S.q||'')}" placeholder="Search terminals by name, street, or TCN" style="margin-bottom:12px" oninput="S.q=this.value;render()">
  ${regionPicker('region',true)}
  ${list.length?'':'<div class="card empty">No terminals match that search.</div>'}
  ${list.map(t=>{const r=latest(t.id),f=fresh(r);return`
  <button class="term" onclick="terminal('${t.id}')">
    <span class="edge" style="background:${f?ST[r.status].c:'var(--chip)'}"></span>
    <span class="body"><h3>${esc(t.name)}</h3>
      <span class="addr">${esc(t.addr)}</span>
      <span class="facts">${f?`${lineTxt(r)}<span>${lanesTxt(r)}</span><span>${whenTxt(r)}</span>`:`<span>No report in the last 2 hours</span>`}</span>
    </span>
    ${f?`<span class="pill" style="background:${ST[r.status].c}">${ST[r.status].n}</span>`:`<span class="pill none">No data</span>`}
  </button>`}).join('')}`;
}
function terminal(id){
  const t=TERMINALS.find(x=>x.id===id),reps=D.reports.filter(r=>r.terminal_id===id).slice(0,8);
  openSheet(head(esc(t.name))+`<p class="addr" style="margin:0 0 14px">${esc(t.addr)}<br>TCN ${esc(t.id)}</p>
  <button class="btn block" onclick="reportForm('${id}')">Report rack status</button>
  <h3 class="section" style="margin-top:18px">Reports from the last 24 hours</h3>
  ${reps.length?reps.map(r=>`<div class="report ${fresh(r)&&!r.disputed&&!r.hidden?'':'stale'}">
    <div class="top"><span class="mini" style="background:${ST[r.status].c}">${ST[r.status].n}</span><span class="addr">${r.disputed?'<b>Disputed by drivers</b> &nbsp;':''}${r.hidden?'<b>Hidden after reports</b> &nbsp;':''}${whenTxt(r)}</span></div>
    <div class="facts">${lineTxt(r)}<span>${lanesTxt(r)}</span><span>${r.user_id===uid()?'Your report':'Verified driver'}</span></div>
    ${r.note?`<p style="margin:6px 0 0">${esc(r.note)}</p>`:''}
    <div class="actions">${canUpdate(r)?`<button class="btn" onclick="reportForm('${id}',${r.id})">Update my spot</button>${r.ahead?`<button class="btn alt" onclick="loadingNow(${r.id},this)">I'm loading now</button>`:''}`
      :`${fresh(r)&&!r.disputed?`<button class="ghost" onclick="confirmR(${r.id},'${id}')">✓ Still accurate (${r.ok})</button><button class="ghost" onclick="disputeR(${r.id},'${id}')">✗ Not accurate (${r.bad||0})</button>`:''}<button class="ghost" onclick="flag('report',${r.id})">⚑ Report</button>`}</div>
  </div>`).join(''):'<p class="empty">No reports yet. Be the first when you get there.</p>'}`);
}
async function confirmR(rid,tid){
  if(!canDrive())return;
  const {error}=await sb.from('report_confirms').insert({report_id:rid});
  if(error){toast(error.code==='23505'?'You already confirmed this one':'Could not confirm: '+error.message);return}
  const r=D.reports.find(x=>x.id===rid);if(r)r.ok++;terminal(tid);toast('Thanks for confirming');
}
async function disputeR(rid,tid){
  if(!canDrive())return;
  const {error}=await sb.from('report_disputes').insert({report_id:rid});
  if(error)return toast(error.code==='23505'?'You already marked this one':'Could not send: '+error.message);
  const r=D.reports.find(x=>x.id===rid);if(r){r.bad=(r.bad||0)+1;if(r.bad>=3)r.disputed=true}
  terminal(tid);toast('Thanks. Marked as not accurate.');track('report_disputed',{terminal:tid});
}
let draft;
function stepper(key,label){return `<label>${label}</label><div class="stepper"><button onclick="step('${key}',-1)" aria-label="Fewer">−</button><output id="st_${key}">${draft[key]}</output><button onclick="step('${key}',1)" aria-label="More">+</button></div>`}
function reportForm(id,rid){
  if(!canDrive())return;
  const t=TERMINALS.find(x=>x.id===id),r=rid?D.reports.find(x=>x.id===rid):null;
  draft={tid:id,rid:r?r.id:null,s:r?r.status:null,ahead:r&&r.ahead!=null?r.ahead:0,behind:r&&r.behind!=null?r.behind:0};
  openSheet(head((r?'Update: ':'Report: ')+esc(t.name))+`
  <label>How busy is it?</label>
  <div class="statusPick" id="sp">${ST.map((s,i)=>`<button style="background:${s.c}" aria-pressed="${draft.s===i}" onclick="pick(${i})">${s.n}</button>`).join('')}</div>
  ${D.noUpdates?stepper('ahead','Trucks in line'):stepper('ahead','Trucks ahead of me')+stepper('behind','Trucks behind me (still waiting)')}
  <p class="note" id="tot" style="margin-top:8px"></p>
  <label for="dn">Lanes down</label>
  <select id="dn">${Array.from({length:9},(_,i)=>`<option value="${i}" ${r&&r.lanes_down===i?'selected':''}>${i}</option>`).join('')}</select>
  <label for="nt">Anything else? (optional)</label>
  <textarea id="nt" maxlength="300" placeholder="Example: lane 2 out of additive">${r&&r.note?esc(r.note):''}</textarea>
  <label class="check"><input type="checkbox" id="pk"> I'm parked or stopped. I am not driving.</label>
  <button class="btn block" onclick="submitReport(this)">${r?'Save update':'Post report'}</button>`);
  showTot();
}
function showTot(){const e=$('tot');if(!e)return;e.textContent=D.noUpdates?'':`That's ${draft.ahead+draft.behind+1} trucks in line, counting you.`}
function pick(i){draft.s=i;[...$('sp').children].forEach((b,j)=>b.setAttribute('aria-pressed',i===j))}
function step(k,d){draft[k]=Math.min(200,Math.max(0,draft[k]+d));$('st_'+k).textContent=draft[k];showTot()}
async function submitReport(b){
  if(draft.s===null)return toast('Pick how busy it is');
  if(!$('pk').checked)return toast("Only post when you're parked");
  const row={status:draft.s,lanes_down:+$('dn').value,note:$('nt').value.trim()||null};
  if(D.noUpdates)row.trucks=draft.ahead;
  else{row.ahead=draft.ahead;row.behind=draft.behind;row.trucks=draft.ahead+draft.behind+1}
  busy(b,true,draft.rid?'Saving...':'Posting...');
  const {error}=draft.rid?await sb.from('reports').update(row).eq('id',draft.rid):await sb.from('reports').insert({...row,terminal_id:draft.tid});
  busy(b,false);
  if(error)return toast((draft.rid?'Could not update: ':'Could not post: ')+error.message);
  track(draft.rid?'spot_updated':'rack_report',{terminal:draft.tid,region:(TERMINALS.find(x=>x.id===draft.tid)||{}).region});closeSheet();toast(draft.rid?'Your spot is updated':'Report posted');loadReports();
}
async function loadingNow(rid,b){
  const r=D.reports.find(x=>x.id===rid);if(!r)return;
  busy(b,true,'Saving...');
  const {error}=await sb.from('reports').update({ahead:0,behind:r.behind||0,trucks:(r.behind||0)+1}).eq('id',rid);
  busy(b,false);
  if(error)return toast('Could not update: '+error.message);
  closeSheet();toast("Updated. You're loading.");loadReports();
}

/* ---------- SCALES ---------- */
const SCALE_FRESH=60*M;
async function loadScales(){
  const since=new Date(Date.now()-3*60*M).toISOString();
  const [s,r]=await Promise.all([
    sb.from('scales').select('*').order('highway').order('name'),
    sb.from('scale_reports').select('id,scale_id,is_open,created_at,user_id').gte('created_at',since).order('created_at',{ascending:false}).limit(1000)]);
  if(s.error||r.error){D.scales=[];D.scalesErr=true;if(S.tab==='scales')render();return}
  D.scalesErr=false;D.scales=s.data;D.sreports=r.data;
  if(S.tab==='scales')render();
}
function scaleStatus(id){
  const recent=D.sreports.filter(x=>x.scale_id===id&&Date.now()-T(x.created_at)<SCALE_FRESH);
  if(!recent.length)return null;
  const last=recent[0],agree=recent.filter(x=>x.is_open===last.is_open).length;
  return {open:last.is_open,at:T(last.created_at),agree};
}
function scaleLabel(s){return `${esc(s.highway)}${s.direction?' '+esc(s.direction):''}`}
function scales(){
  if(!D.scales){loadScales();return '<div class="card empty">Loading...</div>'}
  if(D.scalesErr)return '<div class="card empty">Scale reports are almost ready. Check back soon.</div>';
  const list=D.scales.filter(s=>s.approved&&(S.scaleRegion==='All'||s.region===S.scaleRegion))
    .sort((a,b)=>((scaleStatus(b.id)?1:0)-(scaleStatus(a.id)?1:0))||(a.highway+a.name).localeCompare(b.highway+b.name));
  const mineWaiting=D.scales.filter(s=>!s.approved&&s.created_by===uid());
  const isAdmin=D.me&&D.me.is_admin;
  return `<h2 class="section">Scale reports</h2>
  <p class="note">Is the scale open or closed? Reports clear after 1 hour. Only report when you're parked or stopped, or have your co-driver tap it.</p>
  ${regionPicker('scaleRegion',true)}
  ${list.length?'':'<div class="card empty">No scales listed for this area yet. Know one? Add it below.</div>'}
  ${list.map(s=>{const st=scaleStatus(s.id);return `<div class="card scalecard">
    <div class="scaleTop">
      <div><h3 style="font-size:22px">${esc(s.name)} <span class="hw">${scaleLabel(s)}</span></h3>
        ${s.near?`<div class="addr">${esc(s.near)}</div>`:''}
        <div class="addr">${st?`Reported ${ago(st.at)}${st.agree>1?`, ${st.agree} drivers agree`:''}`:'No report in the last hour'}</div></div>
      ${st?`<span class="pill" style="background:${st.open?'var(--s3)':'var(--s0)'}">${st.open?'Open':'Closed'}</span>`:'<span class="pill none">No data</span>'}
    </div>
    <div class="actions"><button class="btn scalebtn open" onclick="reportScale(${s.id},true,this)">It's open</button><button class="btn scalebtn closed" onclick="reportScale(${s.id},false,this)">It's closed</button>
      ${isAdmin?`<button class="ghost" onclick="removeScale(${s.id})">Remove</button>`:''}</div>
  </div>`}).join('')}
  ${mineWaiting.length?`<div class="card"><b>Waiting for approval:</b> ${mineWaiting.map(s=>esc(s.name+' '+s.highway)).join(', ')}</div>`:''}
  <button class="btn alt block" style="margin-top:6px" onclick="scaleForm()">Add a scale that's missing</button>`;
}
async function reportScale(id,open,b){
  if(!canDrive())return;
  const s=D.scales.find(x=>x.id===id);
  if(!confirm(`Report ${s.name} ${s.highway}${s.direction?' '+s.direction:''} as ${open?'OPEN':'CLOSED'}?\n\nOnly report when you're parked or stopped.`))return;
  busy(b,true,'Sending...');
  const {data,error}=await sb.from('scale_reports').insert({scale_id:id,is_open:open}).select('id,scale_id,is_open,created_at,user_id').single();
  busy(b,false);
  if(error)return toast('Could not report: '+error.message);
  if(!D.sreports.some(x=>x.id===data.id))D.sreports.unshift(data);
  track('scale_report',{scale:s.name+' '+s.highway,status:open?'open':'closed'});
  render();toast('Thanks! Scale reported '+(open?'open':'closed'));
}
function scaleForm(){
  if(!canPost())return;
  openSheet(head('Add a scale')+`
  <p class="note">Tell us where it is. An admin will check it before it shows up.</p>
  <label for="sc_n">Name or nearest town</label><input type="text" id="sc_n" maxlength="80" placeholder="Example: Seguin">
  <label for="sc_h">Highway</label><input type="text" id="sc_h" maxlength="40" placeholder="Example: I-10 or US-281">
  <label for="sc_d">Direction</label><select id="sc_d"><option value="">Not sure</option><option>NB</option><option>SB</option><option>EB</option><option>WB</option><option>Both</option></select>
  <label for="sc_w">Where exactly? (optional)</label><input type="text" id="sc_w" maxlength="120" placeholder="Example: Mile 616, east of town">
  <label for="sc_r">Area</label><select id="sc_r">${REGIONS.map(r=>`<option ${r===(S.scaleRegion==='All'?(D.me&&D.me.region):S.scaleRegion)?'selected':''}>${r}</option>`).join('')}</select>
  <button class="btn block" style="margin-top:14px" onclick="submitScale(this)">Send to admin</button>`);
}
async function submitScale(b){
  const name=$('sc_n').value.trim(),hw=$('sc_h').value.trim().toUpperCase();
  if(name.length<2)return toast('Add the name or nearest town');
  if(!hw)return toast('Add the highway');
  const row={name,highway:hw,region:$('sc_r').value,near:$('sc_w').value.trim()||null};
  if($('sc_d').value)row.direction=$('sc_d').value;
  busy(b,true,'Sending...');
  const {error}=await sb.from('scales').insert(row);
  busy(b,false);
  if(error)return toast('Could not send: '+error.message);
  closeSheet();toast('Sent! It will show once an admin approves it.');D.scales=null;loadScales();if(D.me&&D.me.is_admin){D.admin.loading=false;loadAdmin()}
}
async function removeScale(id){
  const s=D.scales.find(x=>x.id===id);
  if(!confirm(`Remove ${s.name} ${s.highway} from the list? Its reports will be deleted too.`))return;
  const {error}=await sb.from('scales').delete().eq('id',id);
  if(error)return toast(error.message);
  toast('Removed');D.scales=null;loadScales();if(D.me&&D.me.is_admin){D.admin.loading=false;loadAdmin()}
}

/* ---------- CITY CHAT ---------- */
async function loadChat(r){
  const {data,error}=await sb.from('chat_messages').select('*,profiles(*)')
    .eq('region',r).order('created_at',{ascending:false}).limit(100);

function feed(){

    ${p.text?`<p>${esc(p.text)}</p>`:''}

async function addPost(b){
  if(!canPost())return;const text=$('pt').value.trim();let link=$('pl').value.trim();

async function like(id){

  else{const {error}=await sb.from('post_likes').insert({post_id:id});if(error&&error.code!=='23505')return toast(error.message);D.liked.add(id);if(!error)p.likes++}

async function delPost(id){if(!confirm('Delete this post?'))return;const {error}=await sb.from('posts').delete().eq('id',id);if(error)return toast(error.message);loadPosts()}

async function loadJobs(){

    sb.from('companies').select('id,name').order('name'),

function reviewsOf(cid){return D.reviews.filter(r=>r.company_id===cid)}
function avg(list,k){if(!list.length)return 0;return list.reduce((s,x)=>s+(k?x[k]:CATS.reduce((a,[q])=>a+x[q],0)/CATS.length),0)/list.length}
function cname(id){const c=(D.companies||[]).find(x=>x.id===id);return c?c.name:'Company'}
function jobCard(j){return `<div class="card"><span class="hiring" style="margin-top:0">Hiring</span> <b>${esc(cname(j.company_id))}</b>

  <div class="actions">${thumb('job',j.id,j.user_id===uid())}${j.hidden?'<span class="addr"><i>Hidden after reports</i></span>':''}${j.user_id===uid()?'':`<button class="ghost" onclick="flag('job',${j.id})">⚑ Report</button>`}</div></div>`}
function jobs(){

function company(id){

    <p style="margin:6px 0 0">${esc(r.text)}</p><div class="actions"><span class="addr">Verified driver</span><button class="ghost react ${rx('review',r.id).mine?'on':''}" onclick="toggleReact('review',${r.id},${id})">👍 Helpful${rx('review',r.id).n?' ('+rx('review',r.id).n+')':''}</button><button class="ghost" onclick="flag('review',${r.id})">⚑ Report</button></div></div>`).join('')}`);

function companyPicker(){return `<label for="cp">Company</label>
  <select id="cp" onchange="$('cnWrap').style.display=this.value==='__new'?'block':'none'">
    <option value="">Choose a company</option>${D.companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
    <option value="__new">+ Add a company that's not listed</option></select>
  <div id="cnWrap" style="display:none"><label for="cn">Company name</label><input type="text" id="cn" maxlength="100"></div>`}
async function resolveCompany(){
  const v=$('cp').value;
  if(v!=='__new')return v?+v:null;
  const n=$('cn').value.trim();if(n.length<2)return null;
  const found=D.companies.find(x=>x.name.toLowerCase()===n.toLowerCase());if(found)return found.id;
  const {data,error}=await sb.from('companies').insert({name:n}).select('id,name').single();
  if(!error){D.companies.push(data);return data.id}
  const r=await sb.from('companies').select('id,name').ilike('name',n).maybeSingle();
  if(r.data){D.companies.push(r.data);return r.data.id}
  toast(error.message);return null;

function reviewForm(id){

async function submitReview(id,b){

  if(!id&&!$('cp').value)return toast('Choose a company');
  if(!text)return toast('Write a few words first');
  busy(b,true,'Posting...');
  const cid=id||await resolveCompany();
  if(!cid){busy(b,false);return toast('Choose a company')}
  row.company_id=cid;

function jobForm(){
  if(!canPost())return;
  openSheet(head('Post a job')+companyPicker()+`
  <label for="jt">Job title</label><input type="text" id="jt" maxlength="150" placeholder="Example: Local fuel hauler, day shift">
  <label for="jdt">Details</label><textarea id="jdt" maxlength="2000" placeholder="Endorsements needed, schedule, benefits..."></textarea>

async function submitJob(b){
  const title=$('jt').value.trim();
  if(!$('cp').value)return toast('Choose a company');
  if(title.length<2)return toast('Add a job title');
  busy(b,true,'Posting...');

/* ---------- MEMORIAL ---------- */
async function loadTributes(){
  const {data,error}=await sb.from('tributes').select('*,tribute_candles(count)').order('created_at',{ascending:false});
  if(error){console.error(error);return}
  D.tributes=data.map(t=>({...t,candles:t.tribute_candles?.[0]?.count||0}));
  if(S.tab==='memorial')render();
}
function tgal(t){const p=t.photos||[];if(!p.length)return '';
  return `<div class="tgal n${p.length}">${p.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Photo of ${esc(t.name)}" loading="lazy"></a>`).join('')}</div>`}
function addTPhotos(e){
  const files=[...e.target.files].filter(f=>f.type.startsWith('image/'));
  for(const f of files){if(D.tPhotos.length>=2){toast('2 photos max');break}D.tPhotos.push({file:f,url:URL.createObjectURL(f)})}
  render();
}
function dropTPhoto(i){URL.revokeObjectURL(D.tPhotos[i].url);D.tPhotos.splice(i,1);render()}
function shrink(file,max=1400){return new Promise((res,rej)=>{const img=new Image();
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('That photo could not be opened')),'image/jpeg',.85)};
  img.onerror=()=>rej(new Error('That photo could not be opened'));img.src=URL.createObjectURL(file)})}
function memorial(){
  if(!D.tributes)return '<div class="card empty">Loading...</div>';
  return `<h2 class="section">Gone but not forgotten</h2>
  <p class="note">Honoring the fuel haulers we've lost. Tributes are reviewed by an admin before they appear.</p>
  ${D.tributes.length?D.tributes.map(t=>`<div class="card tribute"><h3>${esc(t.name)}${t.approved?'':'<span class="tag-s">waiting for review</span>'}</h3>
    <div class="addr">${esc([t.company,t.years].filter(Boolean).join(', '))}</div>
    ${tgal(t)}
    ${t.message?`<p>${esc(t.message)}</p>`:''}
    ${t.approved?`<div class="actions"><button class="ghost" onclick="candle(${t.id})">🕯 Light a candle (${t.candles})</button></div>`:''}</div>`).join('')
  :'<div class="card empty">No tributes yet.</div>'}
  <div class="card"><h3 class="section">Add a tribute</h3>
    <label for="tn">Driver's name</label><input type="text" id="tn" maxlength="100">
    <label for="tco">Company they drove for</label><input type="text" id="tco" maxlength="100">
    <label for="ty">Years driving (optional)</label><input type="text" id="ty" maxlength="50" placeholder="Example: 1998 to 2025">
    <label for="tm">A few words</label><textarea id="tm" maxlength="2000"></textarea>
    <label>Photos (up to 2)</label>
    <div class="tphotos">${D.tPhotos.map((p,i)=>`<div class="tp"><img src="${p.url}" alt="Chosen photo ${i+1}"><button class="x" onclick="dropTPhoto(${i})" aria-label="Remove photo">✕</button></div>`).join('')}
      ${D.tPhotos.length<2?`<label class="btn alt photoBtn">Add photo<input type="file" accept="image/*" multiple hidden onchange="addTPhotos(event)"></label>`:''}</div>
    <div style="margin-top:14px"><button class="btn" onclick="addTribute(this)">Send for review</button></div>
  </div>`;
}
async function addTribute(b){
  if(!canPost())return;const name=$('tn').value.trim();if(name.length<2)return toast("Add the driver's name");
  busy(b,true,'Sending...');
  const photos=[];
  try{
    for(let i=0;i<D.tPhotos.length;i++){
      const blob=await shrink(D.tPhotos[i].file),path=`${uid()}/${Date.now()}-${i}.jpg`;
      const up=await sb.storage.from('memorial').upload(path,blob,{contentType:'image/jpeg'});
      if(up.error)throw up.error;
      photos.push(sb.storage.from('memorial').getPublicUrl(path).data.publicUrl);
    }
  }catch(err){busy(b,false);return toast('Photo upload failed: '+err.message)}
  const row={name,company:$('tco').value.trim()||null,years:$('ty').value.trim()||null,message:$('tm').value.trim()||null};
  if(photos.length)row.photos=photos;
  const {error}=await sb.from('tributes').insert(row);
  busy(b,false);
  if(error)return toast('Could not send: '+error.message);
  ['tn','tco','ty','tm'].forEach(i=>$(i).value='');D.tPhotos.forEach(p=>URL.revokeObjectURL(p.url));D.tPhotos=[];toast('Sent. It will appear once an admin approves it.');loadTributes();
}
async function candle(id){
  if(!D.session){toast('Sign in first');go('me');return}
  const {error}=await sb.from('tribute_candles').insert({tribute_id:id});
  if(error)return toast(error.code==='23505'?'You already lit a candle':error.message);
  const t=D.tributes.find(x=>x.id===id);if(t)t.candles++;render();
}

    <label for="jrole">I am a...</label>
    <select id="jrole"><option value="">Choose one</option><option value="driver">Driver (CDL fuel hauler)</option><option value="dispatcher">Dispatcher</option><option value="manager">Manager or Supervisor</option><option value="other">Other (fuel industry)</option></select>
    <label for="jr">Home area</label><select id="jr">${REGIONS.map(r=>`<option>${r}</option>`).join('')}</select>
    <label>Endorsements</label>
    <label class="check"><input type="checkbox" value="Tanker (N)" class="je"> Tanker (N)</label>
    <label class="check"><input type="checkbox" value="HazMat (H)" class="je"> HazMat (H)</label>
    <label class="check"><input type="checkbox" value="Tanker + HazMat (X)" class="je"> Tanker + HazMat (X)</label>
    <label for="jem">Email</label><input type="email" id="jem" autocomplete="email">
    <label for="jpw">Password (at least 8 characters)</label><input type="password" id="jpw" autocomplete="new-password">
    <label class="check"><input type="checkbox" id="jagree"> <span>I agree to the <a href="/terms.html" target="_blank" rel="noopener">Terms of Use and Community Rules</a> and have read the <a href="/privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</span></label>
    <button class="btn block" onclick="signUp(this)">Join</button>
    <div class="actions" style="margin-top:12px"><button class="ghost" onclick="S.auth='in';render()">Already joined? Sign in</button></div></div>`;
}
async function signUp(b){
  const name=$('jn').value.trim(),company=$('jc').value.trim(),email=$('jem').value.trim(),password=$('jpw').value;
  if(!name||!company)return toast('Add your name and company');
  if(!email)return toast('Add your email');
  if(password.length<8)return toast('Password needs at least 8 characters');
  const role=$('jrole').value;if(!role)return toast('Tell us if you are a driver, dispatcher, manager, or other');
  if(!$('jagree').checked)return toast('Please agree to the Terms of Use to join');
  const region=$('jr').value,endorsements=[...document.querySelectorAll('.je:checked')].map(x=>x.value);
  busy(b,true,'Joining...');
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{name,company,region,endorsements,role,terms_accepted_at:new Date().toISOString()},emailRedirectTo:location.origin}});
  busy(b,false);
  if(error)return toast(error.message);
  if(data.user&&data.user.identities&&data.user.identities.length===0){S.auth='in';render();return toast('That email already has an account. Sign in instead.')}
  track('sign_up',{method:'email',region});S.region=region;S.city=region;save();
  if(!data.session){D.checkEmail=email;render()}
}
async function signIn(b){
  const email=$('le').value.trim(),password=$('lp').value;
  if(!email||!password)return toast('Enter your email and password');
  busy(b,true,'Signing in...');
  const {error}=await sb.auth.signInWithPassword({email,password});
  busy(b,false);
  if(error)return toast(/confirm/i.test(error.message)?'Confirm your email first. Check your inbox.':error.message);
  toast('Signed in');
}
async function forgot(){
  const email=($('le')&&$('le').value.trim())||prompt('Your email address');if(!email)return;
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
  toast(error?error.message:'Check your email for a reset link');
}
async function setPw(b){
  const p=$('np').value;if(p.length<8)return toast('Use at least 8 characters');
  busy(b,true);const {error}=await sb.auth.updateUser({password:p});busy(b,false);
  if(error)return toast(error.message);D.recovery=false;render();toast('Password updated');
}
async function deleteAccount(b){
  const t=prompt('This permanently deletes your account and everything you posted. Type DELETE to confirm.');
  if(t===null)return;
  if(t.trim().toUpperCase()!=='DELETE')return toast('Your account was not deleted');
  busy(b,true,'Deleting...');
  const id=uid();
  for(const bucket of ['avatars','memorial']){
    try{const {data}=await sb.storage.from(bucket).list(id,{limit:100});if(data&&data.length)await sb.storage.from(bucket).remove(data.map(f=>`${id}/${f.name}`))}catch(e){}
  }
  const {error}=await sb.rpc('delete_my_account');
  busy(b,false);
  if(error)return toast('Could not delete: '+error.message);
  try{await sb.auth.signOut({scope:'local'})}catch(e){}
  D.session=null;D.me=null;D.blocked=new Set();D.chats={};S.tab='racks';save();render();
  toast('Your account has been deleted.');loadReports();loadPosts();loadJobs();loadTributes();
}
async function signOut(){await sb.auth.signOut();D.me=null;D.liked=new Set();D.blocked=new Set();render()}
function pickPhoto(e){
  const f=e.target.files[0];if(!f)return;
  if(!f.type.startsWith('image/'))return toast('Pick a photo file');
  const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{
    const s=256,c=document.createElement('canvas');c.width=c.height=s;
    const m=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
    c.toBlob(uploadPhoto,'image/jpeg',.82);
  };img.onerror=()=>toast('That photo could not be opened');img.src=rd.result};
  rd.readAsDataURL(f);
}
async function uploadPhoto(blob){
  if(!blob)return toast('That photo could not be opened');
  toast('Uploading...');
  const path=uid()+'/avatar.jpg';
  const {error}=await sb.storage.from('avatars').upload(path,blob,{upsert:true,contentType:'image/jpeg'});
  if(error)return toast('Upload failed: '+error.message);
  const url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?v='+Date.now();
  const r=await sb.from('profiles').update({photo_url:url}).eq('id',uid());
  if(r.error)return toast(r.error.message);
  D.me.photo_url=url;person(D.me);render();toast('Photo updated');
}
async function removePhoto(){
  await sb.storage.from('avatars').remove([uid()+'/avatar.jpg']);
  await sb.from('profiles').update({photo_url:null}).eq('id',uid());
  D.me.photo_url=null;person(D.me);render();
}

/* ---------- ADMIN (only visible to admins) ---------- */
const FLAG_SRC={post:['posts','text,link,hidden','Feed post'],chat:['chat_messages','text,region,hidden','Chat message'],review:['reviews','text,hidden','Company review'],job:['jobs','title,details,hidden','Job post'],report:['reports','note,terminal_id,hidden','Rack report']};
const FLAG_DEL={post:'posts',chat:'chat_messages',review:'reviews',job:'jobs',report:'reports'};
async function loadAdmin(){
  if(!D.me||!D.me.is_admin||D.admin.loading)return;
  D.admin.loading=true;
  const [p,d,t,f]=await Promise.all([
    sb.rpc('admin_pending_drivers'),
    sb.from('profiles').select('*').eq('approved',true).order('created_at',{ascending:false}),
    sb.from('tributes').select('*').eq('approved',false).order('created_at'),
    sb.from('content_flags').select('*').eq('cleared',false).order('created_at',{ascending:false}).limit(300)]);
  const err=p.error||d.error||t.error||f.error;
  if(err){D.admin.loading=false;D.admin.error=err.message;if(S.tab==='admin')render();return}
  const want={};f.data.forEach(x=>{if(FLAG_SRC[x.kind])(want[x.kind]=want[x.kind]||[]).push(+x.item_id)});
  const items={};
  await Promise.all(Object.keys(want).map(async k=>{const [tb,cols]=FLAG_SRC[k];const {data}=await sb.from(tb).select('id,'+cols).in('id',want[k]);(data||[]).forEach(r=>items[k+':'+r.id]=r)}));
  const sc=await sb.from('scales').select('*').eq('approved',false).order('created_at');
  D.admin={pending:p.data||[],drivers:d.data||[],tributes:t.data||[],flags:f.data,items,scales:sc.error?[]:sc.data};
  render();
}
function flagText(x){
  const it=D.admin.items[x.kind+':'+x.item_id];if(!it)return '<i>Already deleted</i>';
  if(x.kind==='post')return esc(it.text||'')+(it.link?'<br>'+esc(it.link):'');
  if(x.kind==='chat')return esc(it.text)+` <span class="addr">(${esc(it.region)} chat)</span>`;
  if(x.kind==='job')return '<b>'+esc(it.title)+'</b> '+esc(it.details||'');
  if(x.kind==='report'){const t=TERMINALS.find(z=>z.id===it.terminal_id);return esc(it.note||'(no note)')+` <span class="addr">(${esc(t?t.name:it.terminal_id)})</span>`}
  return esc(it.text||'');
}
function admin(){
  if(!D.me||!D.me.is_admin)return '<div class="card empty">Admins only.</div>';
  const A=D.admin;
  if(A.error)return `<div class="card"><b>Admin tools aren't set up yet.</b><p class="note">Run the admin setup script in Supabase, then tap Refresh.</p><p class="addr">${esc(A.error)}</p><button class="btn alt" onclick="D.admin={};loadAdmin()">Refresh</button></div>`;
  if(!A.pending){loadAdmin();return '<div class="card empty">Loading...</div>'}
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 class="section">Admin</h2><button class="ghost" onclick="D.admin.loading=false;loadAdmin()">Refresh</button></div>
  <p class="note">Only you can see this page.</p>

  <h3 class="section" style="font-size:22px;margin-top:10px">Posting turned off (${A.pending.length})</h3>
  ${A.pending.length?A.pending.map(p=>`<div class="card">
    <b>${esc(p.name)}</b> ${roleTag(p)} <span class="addr">joined ${ago(T(p.created_at))}</span>
    ${p.paused_at?`<div><span class="tag-s">Paused automatically ${ago(T(p.paused_at))} after reports from members</span></div>`:''}
    <div class="addr">${esc(p.company)}, ${esc(p.region)}</div>
    <div class="addr">${esc(p.email)}</div>
    <div class="addr">Endorsements: ${p.endorsements&&p.endorsements.length?p.endorsements.map(esc).join(', '):'none listed'}</div>
    <div class="actions"><button class="btn" onclick="setApproved('${p.id}',true,this)">Turn posting back on</button></div>
  </div>`).join(''):'<div class="card empty">Nobody.</div>'}

  <h3 class="section" style="font-size:22px;margin-top:20px">Memorial tributes waiting (${A.tributes.length})</h3>
  ${A.tributes.length?A.tributes.map(t=>`<div class="card">
    <b>${esc(t.name)}</b>
    <div class="addr">${esc([t.company,t.years].filter(Boolean).join(', '))}</div>
    ${tgal(t)}
    ${t.message?`<p>${esc(t.message)}</p>`:''}
    <div class="actions"><button class="btn" onclick="approveTribute(${t.id},this)">Approve</button><button class="ghost" onclick="deleteTribute(${t.id})">Delete</button></div>
  </div>`).join(''):'<div class="card empty">Nothing waiting.</div>'}

  <h3 class="section" style="font-size:22px;margin-top:20px">Scales waiting (${A.scales.length})</h3>
  ${A.scales.length?A.scales.map(s=>`<div class="card">
    <b>${esc(s.name)} ${scaleLabel(s)}</b> <span class="addr">${esc(s.region)}</span>
    ${s.near?`<div class="addr">${esc(s.near)}</div>`:''}
    <div class="actions"><button class="btn" onclick="approveScale(${s.id},this)">Approve</button><button class="ghost" onclick="removeScale(${s.id})">Delete</button></div>
  </div>`).join(''):'<div class="card empty">Nothing waiting.</div>'}

  <h3 class="section" style="font-size:22px;margin-top:20px">Reported by members (${flagGroups().length})</h3>
  ${flagGroups().length?flagGroups().map(g=>{const it=A.items[g.kind+':'+g.item_id];return `<div class="card">
    <b>${esc((FLAG_SRC[g.kind]||[,,g.kind])[2])}</b> <span class="addr">reported by ${g.list.length} member${g.list.length>1?'s':''}</span> ${it&&it.hidden?'<span class="tag-s">Hidden automatically</span>':''}
    <p style="margin:6px 0">${flagText(g.list[0])}</p>
    ${g.list.filter(x=>x.reason).map(x=>`<div class="addr">• ${esc(x.reason)}</div>`).join('')}
    <div class="actions"><button class="btn" onclick="resolveFlag('${esc(g.kind)}','${esc(g.item_id)}',true)">Delete it</button><button class="ghost" onclick="resolveFlag('${esc(g.kind)}','${esc(g.item_id)}',false)">${it&&it.hidden?'Put it back':'Keep it'}</button></div>
  </div>`}).join(''):'<div class="card empty">No reports.</div>'}

  <h3 class="section" style="font-size:22px;margin-top:20px">Members (${A.drivers.length})</h3>
  <p class="note">Newest first. Change someone's role if they picked the wrong one.</p>
  <div class="card">${A.drivers.map(d=>`<div class="report" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
    <span><b>${esc(d.name)}</b> ${roleTag(d)}<br><span class="addr">${esc(d.company)}, ${esc(d.region)}, joined ${ago(T(d.created_at))}</span></span>
    ${d.id===uid()?'<span class="addr">You</span>':`<span class="actions" style="margin:0"><select class="rolesel" aria-label="Role for ${esc(d.name)}" onchange="setRole('${d.id}',this.value)">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${(d.role||'driver')===k?'selected':''}>${v}</option>`).join('')}</select><button class="ghost" onclick="if(confirm('Turn off posting for ${esc(d.name).replace(/'/g,'')}?'))setApproved('${d.id}',false,this)">Remove access</button></span>`}
  </div>`).join('')}</div>`;
}
async function approveScale(id,b){
  busy(b,true);const {error}=await sb.from('scales').update({approved:true}).eq('id',id);busy(b,false);
  if(error)return toast(error.message);toast('Scale approved');D.admin.loading=false;loadAdmin();D.scales=null;loadScales();
}
async function setRole(id,role){
  const {error}=await sb.rpc('admin_set_role',{p_user:id,p_role:role});
  if(error)return toast(error.message);toast('Role updated to '+ROLES[role]);D.admin.loading=false;loadAdmin();
}
async function setApproved(id,on,b){
  busy(b,true);const {error}=await sb.rpc('admin_set_approved',{p_user:id,p_approved:on});busy(b,false);
  if(error)return toast(error.message);toast(on?'Posting turned back on':'Posting turned off');D.admin.loading=false;loadAdmin();
}
async function approveTribute(id,b){
  busy(b,true);const {error}=await sb.rpc('admin_set_tribute',{p_id:id,p_approved:true});busy(b,false);
  if(error)return toast(error.message);toast('Tribute approved');D.admin.loading=false;loadAdmin();loadTributes();
}
async function deleteTribute(id){
  if(!confirm('Delete this tribute?'))return;
  const {error}=await sb.from('tributes').delete().eq('id',id);if(error)return toast(error.message);
  toast('Deleted');D.admin.loading=false;loadAdmin();loadTributes();
}
async function resolveFlag(kind,item,del){
  if(del){
    if(!confirm('Delete this for good?'))return;
    const {error}=await sb.from(FLAG_DEL[kind]).delete().eq('id',+item);if(error)return toast(error.message);
    await sb.from('content_flags').delete().eq('kind',kind).eq('item_id',String(item));
  }else{
    const {error}=await sb.rpc('admin_restore',{p_kind:kind,p_item:String(item)});if(error)return toast(error.message);
  }
  if(kind==='post')loadPosts();if(kind==='report')loadReports();if(kind==='review'||kind==='job')loadJobs();if(kind==='chat')D.chats={};
  toast(del?'Deleted':'Put back and reports cleared');D.admin.loading=false;loadAdmin();
}

/* ---------- DRAWING THE SCREEN ---------- */
function render(){
  const a=document.activeElement,fid=a&&a.id,pos=a&&a.selectionStart,keep={};
  document.querySelectorAll('#app input[id],#app textarea[id]').forEach(e=>{if(e.type!=='file'&&e.type!=='checkbox')keep[e.id]=e.value});
  renderTabs();
  $('app').innerHTML=({racks,chat,scales,feed,jobs,memorial,me,admin}[S.tab]||racks)();
  for(const k in keep){const e=$(k);if(e&&e.type!=='file'&&e.type!=='checkbox')e.value=keep[k]}
  if(fid&&$(fid)&&$('app').contains($(fid))){const e=$(fid);e.focus();try{if(pos!=null)e.setSelectionRange(pos,pos)}catch(err){}}
  const m=$('msgs');if(m)m.scrollTop=m.scrollHeight;
}

async function loadMe(){
  if(!uid()){D.me=null;return}
  const {data,error}=await sb.from('profiles').select('*').eq('id',uid()).maybeSingle();
  if(error)console.error(error);
  D.me=data||null;person(D.me);
}
sb.auth.onAuthStateChange((ev,session)=>{
  D.session=session;
  if(ev==='PASSWORD_RECOVERY'){D.recovery=true;S.tab='me'}
  setTimeout(async()=>{await loadMe();await loadBlocks();if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')loadPosts();if(!D.me||!D.me.is_admin){D.admin={};if(S.tab==='admin')S.tab='racks'}else loadAdmin();render()},0);
});

sb.channel('live')
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'reports'},({new:r})=>{
    if(D.reports.some(x=>x.id===r.id))return;D.reports.unshift({...r,ok:0});sortReports();if(S.tab==='racks')render();
  })
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'reports'},({new:r})=>{
    const i=D.reports.findIndex(x=>x.id===r.id);if(i<0)return;D.reports[i]={...D.reports[i],...r};sortReports();if(S.tab==='racks')render();
  })
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},async({new:m})=>{
    const list=D.chats[m.region];if(!list||list.some(x=>x.id===m.id))return;
    if(!D.people[m.user_id]){const {data}=await sb.from('profiles').select('*').eq('id',m.user_id).maybeSingle();person(data)}
    list.push(m);if(S.tab==='chat'&&S.city===m.region)render();
  })
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'posts'},()=>loadPosts())
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'scale_reports'},({new:r})=>{
    if(D.sreports.some(x=>x.id===r.id))return;D.sreports.unshift(r);if(S.tab==='scales')render();
  })
  .subscribe();

render();
(async()=>{
  const {data}=await sb.auth.getSession();D.session=data.session;await loadMe();await loadBlocks();if(S.tab==='admin'&&!(D.me&&D.me.is_admin))S.tab='racks';render();loadAdmin();
  loadReports();loadPosts();loadJobs();loadTributes();
})();
setInterval(()=>{if(S.tab==='racks'||S.tab==='scales')render()},60000);
setInterval(()=>{if(S.tab==='scales')loadScales()},5*60000);
setInterval(loadReports,5*60000);

</script>
<!-- ===== WHO'S ON: members list + online now ===== -->
<style>
#whoBtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9;border:0;border-radius:22px;padding:10px 16px;font:800 italic 17px "Barlow Condensed",sans-serif;text-transform:uppercase;background:linear-gradient(var(--orange2),var(--orange) 45%,var(--orangeDeep));color:#170a00;box-shadow:0 0 14px rgba(255,120,0,.55)}
#whoBox{position:fixed;right:14px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:9;width:280px;max-width:calc(100vw - 28px);max-height:60vh;overflow-y:auto;background:linear-gradient(var(--surface),var(--surface2));border:2px solid var(--orange);border-radius:8px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.6)}
#whoBox.open{display:block}
#whoBox h4{margin:0;padding:10px 12px;border-bottom:1px solid var(--line);font:800 italic 19px "Barlow Condensed",sans-serif;text-transform:uppercase;color:var(--orange2);position:sticky;top:0;background:var(--surface)}
.whoRow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.whoRow .av{position:relative}
.whoDot{width:10px;height:10px;border-radius:50%;background:#4a4d52;flex:none}
.whoDot.on{background:#2ecc40;box-shadow:0 0 6px #2ecc40}
.whoName{font-weight:600;font-size:15px}
.whoSub{color:var(--muted);font-size:13px}
.whoRow.on .whoSub{color:#5fe07a}
</style>
<script>
(function(){
  let members=[],online={},ch=null,me=null,lastTab='',cur=null;
  const btn=document.createElement('button');btn.id='whoBtn';btn.setAttribute('aria-label','Who is online');
  const box=document.createElement('div');box.id='whoBox';
  btn.onclick=()=>box.classList.toggle('open');
  function tabLabel(k){if(k==='admin')return 'Admin';const t=TABS.find(x=>x[0]===k);return t?t[1]:''}
  function where(t){const l=tabLabel(t);return l?'On '+l+' now':'Online now'}
  function draw(){
    const on=members.filter(m=>online[m.id]).length;
    btn.textContent='🟢 '+on+' online / '+members.length+' members';
    const list=[...members].sort((a,b)=>(online[b.id]?1:0)-(online[a.id]?1:0)||String(a.name).localeCompare(String(b.name)));
    box.innerHTML='<h4>'+members.length+' members, '+on+' online</h4>'+list.map(m=>{const o=online[m.id];
      return '<div class="whoRow'+(o?' on':'')+'"><span class="whoDot'+(o?' on':'')+'"></span>'+av(m.name,m.photo_url,30)+
      '<div><div class="whoName">'+esc(m.name||'Driver')+(m.id===me?' (you)':'')+'</div><div class="whoSub">'+
      (o?esc(where(o.tab)):esc([ROLES[m.role]||'Driver',m.company].filter(Boolean).join(', ')))+'</div></div></div>'}).join('');
  }
  async function loadMembers(){
    const {data,error}=await sb.from('profiles').select('id,name,company,role,photo_url').order('name');
    if(error){console.error('Who is on:',error);return}
    members=data||[];draw();
  }
  async function start(session){
    if(ch){sb.removeChannel(ch);ch=null}
    online={};
    if(!session){btn.remove();box.remove();return}
    me=session.user.id;
    document.body.append(btn,box);
    if(window.innerWidth>=1100)box.classList.add('open');
    await loadMembers();
    ch=sb.channel('who-online',{config:{presence:{key:me}}});
    ch.on('presence',{event:'sync'},()=>{const st=ch.presenceState();online={};for(const k in st)online[k]=st[k][0];draw()})
      .subscribe(async s=>{if(s==='SUBSCRIBED'){lastTab=S.tab;await ch.track({tab:lastTab})}});
  }
  setInterval(()=>{if(ch&&S.tab!==lastTab){lastTab=S.tab;ch.track({tab:lastTab})}},3000);
  setInterval(()=>{if(ch)loadMembers()},5*60000);
  sb.auth.onAuthStateChange((e,session)=>{const id=session?session.user.id:null;if(id!==cur){cur=id;setTimeout(()=>start(session),0)}});
})();
</script>
