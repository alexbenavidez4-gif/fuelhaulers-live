let S; try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.terminals)S=seed();
if(!S.chats){const d=seed();S.chats=d.chats;S.city=d.city}
S.companies.forEach(c=>{if(!c.jobs){c.jobs=c.job?[{title:c.job,details:'',pay:'',home:'',contact:'',t:Date.now()-86400000}]:[];delete c.job}});
if(S.dataVer!==2){const d=seed();S.terminals=d.terminals;const ids=new Set(d.terminals.map(t=>t.id));
  S.reports=S.reports.map(r=>r.tid==='fhr'?{...r,tid:'T-74-TX-2742'}:r).filter(r=>ids.has(r.tid));S.dataVer=2;save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ago(t){const d=Math.round((Date.now()-t)/M);if(d<1)return'just now';if(d<60)return d+' min ago';const h=Math.round(d/60);if(h<24)return h+' hr ago';return Math.round(h/24)+' days ago'}
function latest(tid){return S.reports.filter(r=>r.tid===tid).sort((a,b)=>b.t-a.t)[0]}
function fresh(r){return r&&Date.now()-r.t<FRESH}
function stars(v){const f=Math.round(v);return'★'.repeat(f)+'☆'.repeat(5-f)}
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h}
function av(name,sz=32){
  const p=S.user&&name===S.user.name&&S.user.photo;
  if(p)return `<img class="av" src="${p}" alt="" style="width:${sz}px;height:${sz}px">`;
  const ini=esc(String(name).trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase());
  return `<span class="av" aria-hidden="true" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.42)}px;background:hsl(${hue(name)} 45% 38%)">${ini}</span>`;
}
function pickPhoto(e){
  const f=e.target.files[0];if(!f)return;
  if(!f.type.startsWith('image/'))return toast('Pick a photo file');
  const rd=new FileReader();
  rd.onload=()=>{const img=new Image();img.onload=()=>{
    const s=256,c=document.createElement('canvas');c.width=c.height=s;
    const m=Math.min(img.width,img.height);
    c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
    S.user.photo=c.toDataURL('image/jpeg',.82);save();render();toast('Photo updated');
  };img.onerror=()=>toast('That photo could not be opened');img.src=rd.result};
  rd.readAsDataURL(f);
}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}
function openSheet(html){$('sheet').innerHTML=html;$('sheetWrap').classList.add('open');document.body.style.overflow='hidden'}
function closeSheet(){$('sheetWrap').classList.remove('open');document.body.style.overflow=''}
$('sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
const head=t=>`<div class="sheetHead"><h2>${t}</h2><button class="x" onclick="closeSheet()" aria-label="Close">✕</button></div>`;
function needUser(){if(S.user)return false;toast('Join first to post');S.tab='me';render();return true}

function renderTabs(){$('tabs').innerHTML=TABS.map(([k,l,i])=>`<button aria-current="${S.tab===k}" onclick="go('${k}')"><span class="ic" aria-hidden="true">${i}</span><span>${l}</span></button>`).join('')}

function sendMsg(){

}
function go(k){S.tab=k;save();render();window.scrollTo(0,0)}

/* RACKS */
function racks(){
  const q=(S.q||'').toLowerCase();
  const list=S.terminals.filter(t=>(S.region==='All'||t.region===S.region)&&(!q||(t.name+' '+t.addr+' '+t.id).toLowerCase().includes(q)))
    .sort((a,b)=>((fresh(latest(b.id))?1:0)-(fresh(latest(a.id))?1:0))||a.name.localeCompare(b.name));
  return `<p class="note">Terminals from the IRS approved fuel terminal list (June 2026). Rack reports shown are demo examples.</p>
  <input type="text" id="tq" value="${esc(S.q||'')}" placeholder="Search terminals by name, street, or TCN" style="margin-bottom:12px" oninput="S.q=this.value;const p=this.selectionStart;render();const e=$('tq');e.focus();e.setSelectionRange(p,p)">
  <div class="chips">${['All',...REGIONS].map(r=>`<button class="chip" aria-pressed="${S.region===r}" onclick="S.region='${r}';save();render()">${r}</button>`).join('')}</div>
  ${list.length?'':'<div class="card empty">No terminals added for this city yet.</div>'}
  ${list.map(t=>{const r=latest(t.id),f=fresh(r);return`
  <button class="term" onclick="terminal('${t.id}')">
    <span class="edge" style="background:${f?ST[r.s].c:'var(--chip)'}"></span>
    <span class="body"><h3>${esc(t.name)}${t.sample?'<span class="tag">sample</span>':''}</h3>
      <span class="addr">${esc(t.addr)}</span>
      <span class="facts">${f?`<span><b>${r.trucks}</b> in line</span><span>${lanesTxt(t,r)}</span><span>${ago(r.t)}</span>`:`<span>No report in the last 2 hours</span>`}</span>
    </span>
    ${f?`<span class="pill" style="background:${ST[r.s].c}">${ST[r.s].n}</span>`:`<span class="pill none">No data</span>`}
  </button>`}).join('')}`;
}
function lanesTxt(t,r){if(t.lanes)return `<b>${t.lanes-r.down}</b> of ${t.lanes} lanes open`;return r.down?`<b>${r.down}</b> lane${r.down>1?'s':''} down`:'No lanes reported down'}
function terminal(id){
  const t=S.terminals.find(x=>x.id===id),reps=S.reports.filter(r=>r.tid===id).sort((a,b)=>b.t-a.t).slice(0,8);
  openSheet(head(esc(t.name))+`<p class="addr" style="margin:0 0 14px">${esc(t.addr)}<br>TCN ${esc(t.id)}${t.lanes?`, ${t.lanes} lanes`:''}</p>
  <button class="btn block" onclick="reportForm('${id}')">Report rack status</button>
  <h3 class="section" style="margin-top:18px">Recent reports</h3>
  ${reps.length?reps.map(r=>`<div class="report ${fresh(r)?'':'stale'}">
    <div class="top"><span class="mini" style="background:${ST[r.s].c}">${ST[r.s].n}</span><span class="addr">${ago(r.t)}</span></div>
    <div class="facts"><span><b>${r.trucks}</b> in line</span><span><b>${r.down}</b> lanes down</span><span>Verified driver</span></div>
    ${r.note?`<p style="margin:6px 0 0">${esc(r.note)}</p>`:''}
    ${fresh(r)?`<div class="actions"><button class="ghost" onclick="confirmR(${r.id},'${id}')">Still accurate (${r.ok})</button></div>`:''}
  </div>`).join(''):'<p class="empty">No reports yet. Be the first when you get there.</p>'}`);
}
function confirmR(rid,tid){if(needUser()){closeSheet();return}const r=S.reports.find(x=>x.id===rid);r.ok++;save();terminal(tid);toast('Thanks for confirming')}
let draft;
function reportForm(id){
  if(needUser()){closeSheet();return}
  const t=S.terminals.find(x=>x.id===id);draft={tid:id,s:null,trucks:0,down:0};
  openSheet(head('Report: '+esc(t.name))+`
  <label>How busy is it?</label>
  <div class="statusPick" id="sp">${ST.map((s,i)=>`<button style="background:${s.c}" aria-pressed="false" onclick="pick(${i})">${s.n}</button>`).join('')}</div>
  <label>Trucks in line</label>
  <div class="stepper"><button onclick="step(-1)" aria-label="Fewer">−</button><output id="tc">0</output><button onclick="step(1)" aria-label="More">+</button></div>
  <label for="dn">Lanes down</label>
  <select id="dn">${Array.from({length:(t.lanes||8)+1},(_,i)=>`<option value="${i}">${t.lanes?i+' of '+t.lanes:i}</option>`).join('')}</select>
  <label for="nt">Anything else? (optional)</label>
  <textarea id="nt" placeholder="Example: lane 2 out of additive"></textarea>
  <label class="check"><input type="checkbox" id="pk"> I'm parked or stopped. I am not driving.</label>
  <button class="btn block" onclick="submitReport()">Post report</button>`);
}
function pick(i){draft.s=i;[...$('sp').children].forEach((b,j)=>b.setAttribute('aria-pressed',i===j))}
function step(d){draft.trucks=Math.max(0,draft.trucks+d);$('tc').textContent=draft.trucks}
function submitReport(){
  if(draft.s===null)return toast('Pick how busy it is');
  if(!$('pk').checked)return toast('Only post when you\'re parked');
  S.reports.push({id:Date.now(),tid:draft.tid,s:draft.s,trucks:draft.trucks,down:+$('dn').value,note:$('nt').value.trim(),t:Date.now(),ok:0});
  save();closeSheet();render();toast('Report posted');
}

function avg(c,k){const r=c.reviews;if(!r.length)return 0;return r.reduce((s,x)=>s+(k?x.r[k]:CATS.reduce((a,[q])=>a+x.r[q],0)/CATS.length),0)/r.length}

  <p style="margin:6px 0 0;font-weight:600">${esc(j.title)}</p>

  <div class="facts">${j.pay?`<span><b>Pay:</b> ${esc(j.pay)}</span>`:''}${j.home?`<span><b>Home time:</b> ${esc(j.home)}</span>`:''}${j.contact?`<span><b>Apply:</b> ${esc(j.contact)}</span>`:''}<span>${ago(j.t)}</span></div></div>`}
function jobs(){
  const open=S.companies.flatMap(c=>(c.jobs||[]).map(j=>({...j,c}))).sort((a,b)=>b.t-a.t);

    <div class="actions"><button class="ghost" onclick="company('${c.id}')">Read reviews</button><button class="ghost" onclick="reviewForm('${c.id}')">Write a review</button></div>
  </div>`).join('')}`;
}
function company(id){

function companyPicker(){return `<label for="cp">Company</label>

    <option value="">Choose a company</option>${S.companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}

function resolveCompany(){
  const v=$('cp').value;

    let c=S.companies.find(x=>x.name.toLowerCase()===n.toLowerCase());
    if(!c){c={id:'c'+Date.now(),name:n,jobs:[],reviews:[]};S.companies.push(c)}return c}
  return S.companies.find(x=>x.id===v)||null;

function reviewForm(id){

  c.reviews.push({r,text,t:Date.now()});save();render();company(c.id);toast('Review posted');

  return `<h2 class="section">Gone but not forgotten</h2>
  <p class="note">Honoring the fuel haulers we've lost. In the live app, tributes are reviewed by an admin and shared with the family's blessing.</p>
  ${S.tributes.length?S.tributes.map(t=>`<div class="card tribute"><h3>${esc(t.name)}</h3>
    <div class="addr">${esc([t.company,t.years].filter(Boolean).join(', '))}</div>
    ${t.msg?`<p>${esc(t.msg)}</p>`:''}
    <div class="actions"><button class="ghost" onclick="candle(${t.id})">🕯 Light a candle (${t.candles})</button></div></div>`).join('')
  :'<div class="card empty">No tributes yet. Add the first one below.</div>'}
  <div class="card"><h3 class="section">Add a tribute</h3>
    <label for="tn">Driver's name</label><input type="text" id="tn">
    <label for="tc2">Company they drove for</label><input type="text" id="tc2">
    <label for="ty">Years driving (optional)</label><input type="text" id="ty" placeholder="Example: 1998 to 2025">
    <label for="tm">A few words</label><textarea id="tm"></textarea>
    <div style="margin-top:12px"><button class="btn" onclick="addTribute()">Send for review</button></div>
  </div>`;
}
function addTribute(){
  if(needUser())return;const name=$('tn').value.trim();if(!name)return toast('Add the driver\'s name');
  S.tributes.push({id:Date.now(),name,company:$('tc2').value.trim(),years:$('ty').value.trim(),msg:$('tm').value.trim(),candles:0});
  save();render();toast('Tribute added (demo skips admin review)');
}
function candle(id){S.tributes.find(t=>t.id===id).candles++;save();render()}

/* ME */
function me(){
  if(S.user)return `<div class="card"><div class="profTop">${av(S.user.name,96)}
      <div><label class="btn alt photoBtn">${S.user.photo?'Change photo':'Add a photo'}<input type="file" accept="image/*" onchange="pickPhoto(event)" hidden></label>
      ${S.user.photo?`<button class="ghost" style="margin-left:6px" onclick="S.user.photo=null;save();render()">Remove</button>`:''}
      <p class="note" style="margin:8px 0 0">Your truck, your dog, your family. Anything you like.</p></div></div>
    <h2 class="section">${esc(S.user.name)}</h2>
    <div class="addr">${esc(S.user.company)}, ${esc(S.user.region)}</div>
    <p>Endorsements: ${S.user.end.length?S.user.end.join(', '):'none listed'}</p>
    <span class="hiring" style="margin-top:0">Verified driver</span></div>
    <p class="note">In the live app, new drivers wait for an admin to approve them. The demo skips that step.</p>
    <button class="btn alt" onclick="if(confirm('Reset all demo data?')){S=seed();save();render()}">Reset demo data</button>`;
  return `<div class="card"><h2 class="section">Join fuelhaulers.live</h2>
    <p class="note">Drivers only. You'll need to join to post rack reports, reviews, and tributes.</p>
    <label for="jn">Your name</label><input type="text" id="jn">
    <label for="jc">Company you drive for</label><input type="text" id="jc">
    <label for="jr">Home area</label><select id="jr">${REGIONS.map(r=>`<option>${r}</option>`).join('')}</select>
    <label>Endorsements</label>
    <label class="check"><input type="checkbox" value="Tanker (N)" class="je"> Tanker (N)</label>
    <label class="check"><input type="checkbox" value="HazMat (H)" class="je"> HazMat (H)</label>
    <label class="check"><input type="checkbox" value="Tanker + HazMat (X)" class="je"> Tanker + HazMat (X)</label>
    <label class="check"><input type="checkbox" id="jd"> I hold a CDL and haul fuel for a living.</label>
    <p class="note" style="margin-top:10px">You can add a profile photo after you join.</p>
    <button class="btn block" onclick="join()">Join</button></div>`;
}
function join(){
  const name=$('jn').value.trim(),company=$('jc').value.trim();
  if(!name||!company)return toast('Add your name and company');
  if(!$('jd').checked)return toast('This app is for fuel haulers only');
  S.user={name,company,region:$('jr').value,end:[...document.querySelectorAll('.je:checked')].map(x=>x.value)};
  S.region=S.user.region;save();render();toast('Welcome aboard, '+name.split(' ')[0]);
}

function render(){
  renderTabs();$('app').innerHTML=({racks,chat,feed,jobs,memorial,me}[S.tab]||racks)();
  const m=$('msgs');if(m)m.scrollTop=m.scrollHeight;
}
render();
setInterval(()=>{if(S.tab==='racks'&&!$('sheetWrap').classList.contains('open'))render()},60000);
</script>
</body>
</html>
