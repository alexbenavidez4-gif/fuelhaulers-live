<!-- ===== WHO'S ON: members list + online now box (paste right above </body>) ===== -->
<style>
#whoBtn{position:fixed;right:14px;bottom:14px;z-index:9999;background:#FF8A00;color:#08090a;border:0;border-radius:22px;padding:10px 16px;font:italic 700 17px 'Barlow Condensed',Arial,sans-serif;box-shadow:0 0 14px rgba(255,138,0,.55);cursor:pointer}
#whoBox{position:fixed;right:14px;bottom:66px;z-index:9999;width:270px;max-height:60vh;overflow-y:auto;background:#121417;border:2px solid #FF8A00;border-radius:10px;color:#eee;font:16px 'Barlow Condensed',Arial,sans-serif;display:none;box-shadow:0 6px 24px rgba(0,0,0,.6)}
#whoBox.open{display:block}
#whoBox h4{margin:0;padding:10px 12px;border-bottom:1px solid #2a2d31;font-size:19px;font-style:italic;color:#FF8A00;position:sticky;top:0;background:#121417}
.whoRow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #1f2226}
.whoDot{width:10px;height:10px;border-radius:50%;background:#4a4d52;flex:none}
.whoDot.on{background:#2ecc40;box-shadow:0 0 6px #2ecc40}
.whoSub{color:#9a9ea4;font-size:14px}
.whoOn .whoSub{color:#2ecc40}
</style>
<script>
(function(){
  if (typeof sb === 'undefined') return;
  let members = [], online = {}, ch = null, me = null, lastTab = '', cur = null;
  const btn = document.createElement('button'); btn.id = 'whoBtn';
  const box = document.createElement('div'); box.id = 'whoBox';
  btn.onclick = () => box.classList.toggle('open');
  const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const tabNow = () => { try { return (typeof S !== 'undefined' && S.tab) ? S.tab : ''; } catch(e) { return ''; } };
  const where = t => t ? 'On ' + t.charAt(0).toUpperCase() + t.slice(1) + ' now' : 'Online now';

  function draw(){
    const onCount = members.filter(m => online[m.id]).length;
    btn.textContent = '🟢 ' + onCount + ' online / ' + members.length + ' members';
    const list = [...members].sort((a,b) => (online[b.id]?1:0) - (online[a.id]?1:0) || (a.name||'').localeCompare(b.name||''));
    box.innerHTML = '<h4>' + members.length + ' members, ' + onCount + ' online</h4>' + list.map(m => {
      const o = online[m.id];
      return '<div class="whoRow' + (o ? ' whoOn' : '') + '"><span class="whoDot' + (o ? ' on' : '') + '"></span><div><div>' +
        esc(m.name || 'Driver') + (m.id === me ? ' (you)' : '') + '</div><div class="whoSub">' +
        (o ? esc(where(o.tab)) : esc(m.company)) + '</div></div></div>';
    }).join('');
  }

  async function loadMembers(){
    const { data } = await sb.from('profiles').select('id,name,company').order('name');
    members = data || []; draw();
  }

  async function start(session){
    if (ch) { sb.removeChannel(ch); ch = null; }
    online = {};
    if (!session) { btn.remove(); box.remove(); return; }
    me = session.user.id;
    document.body.append(btn, box);
    if (window.innerWidth >= 1100) box.classList.add('open');
    await loadMembers();
    ch = sb.channel('who-online', { config: { presence: { key: me } } });
    ch.on('presence', { event: 'sync' }, () => {
      const st = ch.presenceState(); online = {};
      for (const k in st) online[k] = st[k][0];
      draw();
    }).subscribe(async status => {
      if (status === 'SUBSCRIBED') { lastTab = tabNow(); await ch.track({ tab: lastTab }); }
    });
  }

  setInterval(() => { if (ch) { const t = tabNow(); if (t !== lastTab) { lastTab = t; ch.track({ tab: t }); } } }, 3000);
  setInterval(() => { if (ch) loadMembers(); }, 5 * 60000);
  sb.auth.onAuthStateChange((event, session) => {
    const id = session ? session.user.id : null;
    if (id !== cur) { cur = id; setTimeout(() => start(session), 0); }
  });
})();
</script>
<!-- ===== END WHO'S ON ===== -->
