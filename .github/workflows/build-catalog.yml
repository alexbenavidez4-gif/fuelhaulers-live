name: Build knowledge catalog
# Rebuilds the terminal, rack, guide, and About pages, llms.txt, terminals.json,
# and sitemap.xml whenever the catalog, the builder, or the app's rack list changes.
on:
  push:
    branches: [main]
    paths:
      - data/catalog.json
      - tools/build_catalog.py
      - index.html
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: build-catalog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build pages
        run: python3 tools/build_catalog.py
      - name: Save changes
        run: |
          # sitemap/terminals.json carry today's date; only commit when pages really changed
          if git diff --quiet -- terminals racks guides about llms.txt assets && [ -z "$(git ls-files --others --exclude-standard terminals racks guides about)" ]; then
            echo "No page changes."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add terminals racks guides about llms.txt terminals.json sitemap.xml assets
          git commit -m "Rebuild knowledge catalog pages"
          git push
          # pushes made by this workflow don't start a site update on their own, so ask for one
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Could not request a Pages build"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Tell Bing and other IndexNow search engines about the pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          urls = re.findall(r"<loc>([^<]+)</loc>", open("sitemap.xml").read())
          body = json.dumps({"host": "fuelhaulers.live", "key": "cdab372d682e537a7940e7ba2a53b158",
                             "keyLocation": "https://fuelhaulers.live/cdab372d682e537a7940e7ba2a53b158.txt",
                             "urlList": urls[:10000]}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              r = urllib.request.urlopen(req, timeout=30)
              print("IndexNow:", r.status, "-", len(urls), "URLs sent")
          except Exception as e:
              print("IndexNow request failed (not fatal):", e)
          PY
